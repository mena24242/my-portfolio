<style>
/* =====================================================================
   Mena Medhat — Portfolio styles
   Dark (default) + Light theme via [data-theme="light"]
===================================================================== */
:root{
  --bg:#05070d;--bg-2:#0a101d;--panel:#0c1524;--panel-2:#0f1a2e;
  --line:rgba(56,189,248,.14);--line-2:rgba(56,189,248,.28);
  --cyan:#22d3ee;--blue:#38bdf8;--violet:#a78bfa;
  --text:#e6f1fb;--muted:#8fa6bd;
  --card-top:rgba(15,26,46,.55);--card-bot:rgba(12,21,36,.35);
  --surface:#0a1220;--surface-2:rgba(8,13,24,.82);
  --nav-bg:rgba(5,7,13,.72);--dock-bg:rgba(8,13,24,.97);
  --overlay:rgba(3,6,12,.94);--input-bg:rgba(9,16,28,.8);
  --chip-bg:rgba(56,189,248,.06);--chip-bg-soft:rgba(167,139,250,.07);--chip-bg-lang:rgba(52,211,153,.07);
  --float-bg:rgba(12,21,36,.9);--grid-line:rgba(56,189,248,.05);
  --glow-opacity:.5;
  --mono:"SFMono-Regular",ui-monospace,"Cascadia Code",Consolas,Menlo,monospace;
  --sans:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
}
[data-theme="light"]{
  --bg:#eef2f8;--bg-2:#e2e9f3;--panel:#ffffff;--panel-2:#e8eef7;
  --line:rgba(13,90,140,.16);--line-2:rgba(13,90,140,.34);
  --cyan:#0891b2;--blue:#0284c7;--violet:#7c3aed;
  --text:#0e1726;--muted:#52627a;
  --card-top:rgba(255,255,255,.92);--card-bot:rgba(240,245,251,.95);
  --surface:#e3eaf4;--surface-2:rgba(255,255,255,.92);
  --nav-bg:rgba(255,255,255,.86);--dock-bg:rgba(255,255,255,.97);
  --overlay:rgba(8,14,26,.92);--input-bg:rgba(255,255,255,.95);
  --chip-bg:rgba(13,110,170,.08);--chip-bg-soft:rgba(124,92,220,.08);--chip-bg-lang:rgba(14,124,85,.09);
  --float-bg:rgba(255,255,255,.95);--grid-line:rgba(13,90,140,.06);
  --glow-opacity:.22;
}

/* ---------- accent presets (dashboard color picker) ---------- */
[data-accent="cyan"]{ --cyan:#22d3ee; --blue:#38bdf8; --violet:#a78bfa; }
[data-accent="emerald"]{ --cyan:#34d399; --blue:#10b981; --violet:#6ee7b7; }
[data-accent="violet"]{ --cyan:#a78bfa; --blue:#8b5cf6; --violet:#c4b5fd; }
[data-accent="amber"]{ --cyan:#fbbf24; --blue:#f59e0b; --violet:#fcd34d; }
[data-accent="rose"]{ --cyan:#fb7185; --blue:#f43f5e; --violet:#fda4af; }
[data-theme="light"][data-accent="cyan"]{ --cyan:#0891b2; --blue:#0284c7; --violet:#7c3aed; }
[data-theme="light"][data-accent="emerald"]{ --cyan:#059669; --blue:#047857; --violet:#34d399; }
[data-theme="light"][data-accent="violet"]{ --cyan:#7c3aed; --blue:#6d28d9; --violet:#a78bfa; }
[data-theme="light"][data-accent="amber"]{ --cyan:#d97706; --blue:#b45309; --violet:#f59e0b; }
[data-theme="light"][data-accent="rose"]{ --cyan:#e11d48; --blue:#be123c; --violet:#fb7185; }

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
img{max-width:100%;height:auto}
body{
  font-family:var(--sans);background:var(--bg);color:var(--text);
  overflow-x:clip;line-height:1.6;-webkit-font-smoothing:antialiased;
  transition:background .35s ease,color .35s ease;
}
::selection{background:rgba(34,211,238,.3)}

/* ---------- background layers ---------- */
.bg-grid{position:fixed;inset:0;z-index:-3;pointer-events:none;
  background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(ellipse 90% 70% at 50% 0%,#000 30%,transparent 75%);
  -webkit-mask-image:radial-gradient(ellipse 90% 70% at 50% 0%,#000 30%,transparent 75%)}
.bg-glow{position:fixed;z-index:-2;pointer-events:none;border-radius:50%;filter:blur(90px);opacity:var(--glow-opacity)}
.bg-glow.g1{width:520px;height:520px;background:rgba(34,211,238,.16);top:-160px;left:-120px}
.bg-glow.g2{width:560px;height:560px;background:rgba(99,102,241,.14);top:30%;right:-180px}
.bg-glow.g3{width:420px;height:420px;background:rgba(56,189,248,.12);bottom:-140px;left:35%}
#particles{position:fixed;inset:0;z-index:-1;pointer-events:none}

/* ---------- nav ---------- */
nav{position:fixed;top:0;left:0;right:0;z-index:50;backdrop-filter:blur(14px);background:var(--nav-bg);border-bottom:1px solid var(--line);transition:background .35s}
.nav-inner{max-width:1180px;margin:0 auto;padding:0 24px;height:66px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.5px;text-decoration:none;color:var(--text)}
.logo-photo{width:36px;height:36px;border-radius:50%;overflow:hidden;border:2px solid rgba(34,211,238,.55);flex:none;background:var(--surface);box-shadow:0 0 14px rgba(34,211,238,.35)}
.logo-photo img{width:100%;height:100%;object-fit:cover;display:block}
.logo small{display:block;font-size:10px;color:var(--muted);font-weight:400;letter-spacing:2px;text-transform:uppercase}
.nav-links{display:flex;gap:4px;align-items:center}
.nav-links a{color:var(--muted);text-decoration:none;font-size:14px;font-weight:500;padding:8px 13px;border-radius:8px;transition:.2s}
.nav-links a:hover{color:var(--text);background:var(--chip-bg)}
.nav-links a.active{color:var(--cyan)}
.nav-cta{margin-left:8px;padding:9px 16px;border-radius:9px;text-decoration:none;font-size:14px;font-weight:600;color:#04121c;background:linear-gradient(135deg,var(--cyan),var(--blue));box-shadow:0 0 20px rgba(34,211,238,.35);transition:.2s}
.nav-cta:hover{transform:translateY(-1px);box-shadow:0 0 28px rgba(34,211,238,.55)}
.theme-toggle{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:9px;border:1px solid var(--line-2);background:var(--chip-bg);color:var(--text);cursor:pointer;transition:.2s;margin-left:4px}
.theme-toggle:hover{border-color:var(--cyan);background:rgba(34,211,238,.12)}
.theme-toggle svg{width:18px;height:18px}
.lang-toggle{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:9px;border:1px solid var(--line-2);background:var(--chip-bg);color:var(--cyan);cursor:pointer;transition:.2s;margin-left:4px;font-size:14px;font-weight:700;font-family:var(--sans)}
.lang-toggle:hover{border-color:var(--cyan);background:rgba(34,211,238,.12)}
.ti-sun{display:inline-block}
.ti-moon{display:none}
[data-theme="light"] .ti-sun{display:none}
[data-theme="light"] .ti-moon{display:inline-block}
.burger{display:none;background:none;border:1px solid var(--line-2);border-radius:8px;width:42px;height:42px;cursor:pointer}
.burger span{display:block;width:18px;height:2px;background:var(--text);margin:4px auto;transition:.25s;border-radius:2px}
.burger.open span:nth-child(1){transform:translateY(6px) rotate(45deg)}
.burger.open span:nth-child(2){opacity:0}
.burger.open span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}
.mobile-menu{display:none;flex-direction:column;gap:4px;padding:8px 20px 18px;background:var(--nav-bg);border-bottom:1px solid var(--line);max-height:calc(100vh - 60px);overflow-y:auto}
.mobile-menu a{color:var(--muted);text-decoration:none;padding:12px 8px;border-radius:8px;font-weight:500}
.mobile-menu a:hover{color:var(--text);background:var(--chip-bg)}
.mobile-menu .theme-toggle{margin:4px 8px;width:auto;justify-content:flex-start;padding:0 14px}
.mobile-menu .lang-toggle{margin:4px 8px;width:auto;justify-content:center;padding:0 14px;height:38px}
.mobile-menu.open{display:flex}
.mobile-menu .custom-nav a{display:block;padding:12px 8px}

/* ---------- sections ---------- */
section{padding:96px 24px;position:relative}
.container{max-width:1180px;margin:0 auto}
.eyebrow{font-family:var(--mono);font-size:13px;color:var(--cyan);letter-spacing:2px;text-transform:uppercase;display:flex;align-items:center;gap:12px;margin-bottom:14px}
.eyebrow::before{content:"";width:38px;height:1px;background:linear-gradient(90deg,var(--cyan),transparent);flex:none}
h2.section-title{font-size:clamp(28px,4vw,40px);font-weight:800;letter-spacing:-.5px;line-height:1.15}
.section-sub{color:var(--muted);max-width:640px;margin-top:14px;font-size:16px}

/* ---------- hero ---------- */
.hero{min-height:100vh;display:flex;align-items:center;padding-top:120px}
.hero-inner{max-width:1180px;margin:0 auto;width:100%;display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12.5px;color:#9ff1d2;border:1px solid rgba(52,211,153,.3);background:rgba(16,185,129,.08);padding:7px 14px;border-radius:999px;margin-bottom:22px}
[data-theme="light"] .pill{color:#0e7c55;border-color:rgba(14,124,85,.3);background:rgba(16,185,129,.1)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.55)}70%{box-shadow:0 0 0 8px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
.hero h1{font-size:clamp(44px,7vw,78px);font-weight:800;letter-spacing:-2px;line-height:1.02}
.hero h1 .grad{background:linear-gradient(120deg,var(--cyan) 0%,var(--blue) 45%,var(--violet) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.type-line{font-family:var(--mono);font-size:clamp(14px,2.4vw,22px);color:var(--muted);margin-top:16px;min-height:34px;overflow-wrap:break-word;word-break:break-word}
.type-line b{color:var(--cyan);font-weight:600}
.cursor{display:inline-block;width:10px;height:22px;background:var(--cyan);margin-left:4px;vertical-align:-4px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.hero p.lead{color:var(--muted);max-width:520px;margin-top:18px;font-size:17px}
.hero-cta{display:flex;gap:14px;margin-top:34px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:9px;padding:14px 26px;border-radius:11px;text-decoration:none;font-weight:600;font-size:15px;transition:.2s;border:1px solid transparent;cursor:pointer}
.btn svg{width:18px;height:18px;flex:none}
.btn-primary{color:#04121c;background:linear-gradient(135deg,var(--cyan),var(--blue));box-shadow:0 0 24px rgba(34,211,238,.35)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 0 36px rgba(34,211,238,.55)}
.btn-ghost{color:var(--text);border-color:var(--line-2);background:var(--chip-bg)}
.btn-ghost:hover{border-color:var(--cyan);background:rgba(34,211,238,.1);transform:translateY(-2px)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:44px}
.stat{border:1px solid var(--line);border-radius:14px;padding:16px 14px;background:linear-gradient(180deg,var(--card-top),var(--card-bot));backdrop-filter:blur(6px)}
.stat .num{font-family:var(--mono);font-size:clamp(20px,3vw,28px);font-weight:700;color:var(--cyan);min-height:34px}
.stat .lbl{font-size:12px;color:var(--muted);margin-top:4px}

/* hero visual */
.hero-visual{display:grid;place-items:center}
.avatar-wrap{position:relative;width:min(360px,82vw);aspect-ratio:1;display:grid;place-items:center}
.orbit{position:absolute;inset:0;border-radius:50%;border:1px dashed rgba(56,189,248,.25);animation:spin 26s linear infinite}
.orbit.o2{inset:34px;animation-duration:18s;animation-direction:reverse;border-color:rgba(167,139,250,.25)}
@keyframes spin{to{transform:rotate(360deg)}}
.avatar-ring{width:min(250px,64vw);aspect-ratio:1;border-radius:50%;padding:5px;position:relative;
  background:conic-gradient(from 0deg,var(--cyan),var(--violet),var(--blue),var(--cyan));
  box-shadow:0 30px 80px rgba(2,8,20,.8),0 0 60px rgba(34,211,238,.22)}
[data-theme="light"] .avatar-ring{box-shadow:0 20px 50px rgba(30,60,90,.25),0 0 40px rgba(8,145,178,.25)}
.avatar-ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;background:var(--surface)}
.float-tag{position:absolute;font-family:var(--mono);font-size:12px;padding:7px 12px;border-radius:9px;border:1px solid var(--line-2);background:var(--float-bg);backdrop-filter:blur(6px);color:var(--text);white-space:nowrap}
.float-tag.t1{top:6%;left:-4%;color:#7dd3fc}
.float-tag.t2{bottom:12%;right:-8%;color:#c4b5fd}
.float-tag.t3{top:50%;right:-12%;color:#67e8f9}
.float-tag.t4{top:12%;right:-8%;color:#f0abfc}
.float-tag.t5{bottom:30%;left:-11%;color:#6ee7b7}
.float-tag.t6{top:30%;left:-9%;color:#fcd34d}
[data-theme="light"] .float-tag.t1{color:#0369a1}
[data-theme="light"] .float-tag.t2{color:#6d28d9}
[data-theme="light"] .float-tag.t3{color:#0e7490}
[data-theme="light"] .float-tag.t4{color:#a21caf}
[data-theme="light"] .float-tag.t5{color:#047857}
[data-theme="light"] .float-tag.t6{color:#b45309}
/* ---------- cards ---------- */
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:44px}
.certs-grid{grid-template-columns:repeat(4,1fr)}
.card{border:1px solid var(--line);border-radius:18px;padding:26px;position:relative;overflow:visible;background:linear-gradient(180deg,var(--card-top),var(--card-bot));transition:.28s}
.card:hover{transform:translateY(-5px);border-color:var(--line-2);box-shadow:0 22px 50px rgba(2,8,20,.45)}
[data-theme="light"] .card:hover{box-shadow:0 18px 40px rgba(30,60,90,.16)}
.card .ico{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;margin-bottom:16px;background:linear-gradient(135deg,rgba(34,211,238,.16),rgba(99,102,241,.16));border:1px solid var(--line-2)}
.card .ico svg{width:24px;height:24px;stroke:var(--cyan)}
.card h3{font-size:18px;margin-bottom:8px;font-weight:700}
.card p{color:var(--muted);font-size:14.5px}

/* ---------- timeline ---------- */
.timeline{margin-top:48px;position:relative;padding-left:30px}
.timeline::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:linear-gradient(180deg,var(--cyan),var(--violet));opacity:.4}
.tl-item{position:relative;padding:0 0 34px 22px}
.tl-item::before{content:"";position:absolute;left:-27px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2.5px solid var(--cyan);box-shadow:0 0 0 4px rgba(34,211,238,.15)}
.tl-card{border:1px solid var(--line);border-radius:16px;padding:24px 26px;background:linear-gradient(180deg,var(--card-top),var(--card-bot));position:relative}
.tl-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.tl-card h3{font-size:19px;font-weight:700}
.role{color:var(--cyan);font-size:14px;font-weight:600;margin-top:2px}
.when{font-family:var(--mono);font-size:12.5px;color:var(--muted);border:1px solid var(--line-2);padding:5px 11px;border-radius:999px;white-space:nowrap}
.b-list{margin-top:14px;padding-left:0;list-style:none}
.b-list li{color:var(--muted);font-size:14.5px;padding-left:22px;position:relative;margin-bottom:8px}
.b-list li::before{content:"▹";position:absolute;left:2px;color:var(--cyan)}
.grade-badge{display:inline-flex;align-items:center;gap:8px;margin-top:12px;font-family:var(--mono);font-size:13px;color:#9ff1d2;border:1px solid rgba(52,211,153,.3);background:rgba(16,185,129,.08);padding:6px 13px;border-radius:9px}
[data-theme="light"] .grade-badge{color:#0e7c55;border-color:rgba(14,124,85,.3);background:rgba(16,185,129,.1)}

/* ---------- skills ---------- */
.skills-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:44px}
.skill-group{border:1px solid var(--line);border-radius:18px;padding:26px;background:linear-gradient(180deg,var(--card-top),var(--card-bot));position:relative}
.skill-group h3{display:flex;align-items:center;gap:10px;font-size:17px;margin-bottom:18px}
.skill-group h3 svg{width:20px;height:20px;stroke:var(--cyan);flex:none}
.chips{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.chip{font-size:13.5px;font-weight:500;color:var(--text);padding:8px 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--chip-bg);transition:.2s;display:inline-flex;align-items:center;gap:7px}
.chip:hover{border-color:var(--cyan);background:rgba(34,211,238,.14)}
.chip.soft{border-color:rgba(167,139,250,.3);background:var(--chip-bg-soft)}
.chip.soft:hover{border-color:var(--violet);background:rgba(167,139,250,.15)}
.chip.lang{border-color:rgba(52,211,153,.3);background:var(--chip-bg-lang)}
.chip.lang:hover{border-color:#34d399;background:rgba(52,211,153,.15)}

/* ---------- projects ---------- */
.project-card{border:1px solid var(--line);border-radius:20px;overflow:hidden;display:grid;grid-template-columns:1fr 1.2fr;background:linear-gradient(180deg,var(--card-top),var(--card-bot));transition:border-color .28s, box-shadow .28s;position:relative;will-change:transform}
.project-card:hover{border-color:var(--line-2);box-shadow:0 26px 60px rgba(2,8,20,.55)}
[data-theme="light"] .project-card:hover{box-shadow:0 22px 48px rgba(30,60,90,.18)}
.project-visual{position:relative;min-height:260px;display:grid;place-items:center;background:radial-gradient(circle at 30% 30%,rgba(34,211,238,.12),transparent 65%),var(--surface);border-right:1px solid var(--line)}
.project-body{padding:30px}
.tag-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.project-body h3{font-size:22px;margin-bottom:4px}
.prole{font-family:var(--mono);font-size:12.5px;color:var(--cyan);letter-spacing:.5px}
.project-body .b-list li{font-size:14px}
.project-links{display:flex;gap:12px;margin-top:18px}

/* ---------- project gallery ---------- */
.gallery{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--surface)}
.gal-stage{position:relative;flex:1;overflow:hidden;cursor:zoom-in;display:grid;place-items:center}
.gal-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .4s ease;padding:8px}
.gal-img.active{opacity:1}
.gal-nav{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--text);font-size:20px;line-height:1;cursor:pointer;display:grid;place-items:center;transition:.15s;backdrop-filter:blur(4px)}
.gal-nav:hover{background:rgba(34,211,238,.2);border-color:var(--cyan);color:var(--cyan)}
.gal-nav.prev{left:12px}.gal-nav.next{right:12px}
.gal-dots{position:absolute;bottom:10px;left:0;right:0;display:flex;gap:7px;justify-content:center;z-index:2}
.gal-dot{width:8px;height:8px;border-radius:50%;border:none;background:rgba(143,166,189,.45);cursor:pointer;padding:0;transition:.2s}
.gal-dot.active{background:var(--cyan);transform:scale(1.35);box-shadow:0 0 8px rgba(34,211,238,.6)}
.gal-count{position:absolute;top:10px;right:12px;font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--surface-2);padding:3px 9px;border-radius:999px;border:1px solid var(--line)}

/* ---------- lightbox ---------- */
.lightbox{position:fixed;inset:0;z-index:100;background:var(--overlay);display:none;align-items:center;justify-content:center;flex-direction:column;padding:20px}
.lightbox.open{display:flex}
.lb-img{max-width:92vw;max-height:78vh;border-radius:14px;object-fit:contain;box-shadow:0 30px 90px rgba(0,0,0,.7);border:1px solid var(--line-2)}
.lb-count{font-family:var(--mono);font-size:13px;color:#9fb3c8;margin-top:16px}
.lb-caption{font-family:var(--mono);font-size:12px;color:var(--cyan);margin-top:6px;letter-spacing:.5px}
.lb-close{position:absolute;top:22px;right:26px;width:44px;height:44px;border-radius:12px;border:1px solid var(--line-2);background:rgba(12,21,36,.9);color:#fff;font-size:22px;cursor:pointer;display:grid;place-items:center;transition:.15s}
.lb-close:hover{background:rgba(244,63,94,.2);border-color:#fb7185;color:#fb7185}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:1px solid var(--line-2);background:rgba(12,21,36,.9);color:#fff;font-size:26px;cursor:pointer;display:grid;place-items:center;transition:.15s}
.lb-nav:hover{background:rgba(34,211,238,.18);border-color:var(--cyan);color:var(--cyan)}
.lb-nav.prev{left:22px}.lb-nav.next{right:22px}
.lb-thumbs{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;justify-content:center}
.lb-thumb{width:58px;height:42px;border-radius:8px;overflow:hidden;border:2px solid transparent;cursor:pointer;opacity:.6;transition:.15s;background:#0a1220;padding:0}
.lb-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.lb-thumb.active{border-color:var(--cyan);opacity:1}

/* ---------- attachments ---------- */
.attachments{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.att-chip{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;border:1px solid var(--line-2);background:var(--chip-bg);color:var(--text);font-size:12.5px;font-weight:600;cursor:pointer;transition:.15s;font-family:var(--sans)}
.att-chip:hover{border-color:var(--cyan);background:rgba(34,211,238,.14);transform:translateY(-1px)}
.att-chip span{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- media modal ---------- */
.media-modal{align-items:center;justify-content:center}
.media-stage{width:min(960px,94vw);max-height:76vh;overflow:auto;display:grid;place-items:center;background:#000;border-radius:14px;border:1px solid var(--line-2)}
.media-stage iframe,.media-stage video{width:100%;height:70vh;border:none;border-radius:14px;background:#000}
.media-stage .pdf-frame{width:100%;height:76vh;border:none;border-radius:14px;background:#fff}
.media-stage img{max-width:92vw;max-height:76vh;border-radius:14px;object-fit:contain;display:block}
.media-fallback{padding:60px 40px;color:#e6f1fb;font-family:var(--mono);font-size:16px}
.media-text{width:min(860px,90vw);max-height:70vh;overflow:auto;padding:32px;color:var(--text);font-size:15px;line-height:1.8;white-space:pre-wrap;font-family:var(--sans);background:var(--panel);border-radius:12px;border:1px solid var(--line-2)}
.media-title{margin-top:14px;font-family:var(--mono);font-size:13px;color:#9fb3c8;letter-spacing:.5px;text-align:center;max-width:90vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:640px){
  .media-stage iframe,.media-stage video{height:52vh}
  .media-stage .pdf-frame{height:60vh}
}

/* ---------- code modal ---------- */
.code-panel{width:min(860px,92vw);max-height:82vh;display:flex;flex-direction:column;background:#0a1424;border:1px solid var(--line-2);border-radius:16px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.6)}
.code-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line)}
.code-title{font-family:var(--mono);color:var(--cyan);font-size:13px;letter-spacing:.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.code-copy{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;border:1px solid var(--line-2);background:var(--chip-bg);color:var(--text);font-size:12.5px;font-weight:600;cursor:pointer;transition:.15s;font-family:var(--sans);flex:none}
.code-copy:hover{border-color:var(--cyan);background:rgba(34,211,238,.14)}
.code-pre{margin:0;padding:20px;overflow:auto;flex:1;font-family:var(--mono);font-size:12.5px;line-height:1.65;color:#d6e6f5;background:#070d18;white-space:pre}

/* ---------- certifications ---------- */
.cert-card{display:flex;flex-direction:column;align-items:flex-start;gap:0}
.cert-badge{flex:none;width:54px;height:54px;border-radius:14px;display:grid;place-items:center;margin-bottom:14px;background:linear-gradient(135deg,rgba(34,211,238,.18),rgba(167,139,250,.18));border:1px solid var(--line-2)}
.cert-badge svg{width:28px;height:28px;stroke:var(--cyan)}
.cert-card h3{font-size:16.5px}
.issuer{font-family:var(--mono);font-size:12px;color:var(--violet);letter-spacing:.5px;margin-top:3px}
.cert-card p{font-size:13px;margin-top:6px}

/* ---------- testimonials ---------- */
.testimonial{display:flex;flex-direction:column}
.t-quote{font-size:52px;line-height:.6;color:var(--cyan);font-family:Georgia,serif;margin-bottom:10px;opacity:.7}
.t-text{color:var(--muted);font-size:14.5px;flex:1}
.t-meta{margin-top:16px;display:flex;flex-direction:column;border-top:1px solid var(--line);padding-top:12px}
.t-meta b{font-size:14px}
.t-meta span{font-size:12px;color:var(--cyan);font-family:var(--mono)}

/* ---------- custom sections (Add Anything) ---------- */
.custom-section{padding:96px 24px;position:relative}
.custom-nav a{color:var(--muted);text-decoration:none;font-size:14px;font-weight:500;padding:8px 13px;border-radius:8px;transition:.2s}
.custom-nav a:hover{color:var(--text);background:var(--chip-bg)}
.block-wrap{margin-top:6px}
.block{margin-bottom:22px}
.block-title{font-size:18px;font-weight:700;margin-bottom:10px}
.block-text{color:var(--muted);font-size:15px;max-width:780px}
.block-image{max-width:100%;border-radius:16px;border:1px solid var(--line);display:block;box-shadow:0 20px 50px rgba(2,8,20,.4)}
[data-theme="light"] .block-image{box-shadow:0 14px 34px rgba(30,60,90,.16)}

/* ---------- contact ---------- */
.contact-wrap{display:grid;grid-template-columns:1fr 1.1fr;gap:26px;margin-top:44px}
.contact-card{border:1px solid var(--line);border-radius:18px;padding:26px;background:linear-gradient(180deg,var(--card-top),var(--card-bot))}
.contact-item{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px dashed var(--line);color:var(--text);text-decoration:none}
.contact-item:last-of-type{border-bottom:none}
.ci-ico{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:var(--chip-bg);border:1px solid var(--line-2);flex:none}
.ci-ico svg{width:20px;height:20px;stroke:var(--cyan)}
.ci-ico.wa{background:rgba(37,211,102,.12);border-color:rgba(37,211,102,.32)}
.ci-ico.wa svg{fill:#25D366;stroke:none}
.ci-val.wa-val{color:#25D366}
[data-theme="light"] .ci-val.wa-val{color:#16a34a}
.contact-item:hover .ci-val.wa-val{color:#25D366}
.ci-lbl{font-size:12px;color:var(--muted)}
.ci-val{font-size:15px;font-weight:600}
.contact-item:hover .ci-val{color:var(--cyan)}
.form{display:flex;flex-direction:column;gap:14px}
.form input,.form textarea{background:var(--input-bg);border:1px solid var(--line);border-radius:11px;padding:14px 16px;color:var(--text);font-family:var(--sans);font-size:15px;outline:none;transition:.2s;resize:vertical}
.form input:focus,.form textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,211,238,.12)}
.form textarea{min-height:120px}
.form-status{margin-top:4px;font-size:13.5px;min-height:18px;color:var(--muted)}
.form-status.ok{color:#34d399}
.form-status.err{color:#fb7185}

/* ---------- share buttons ---------- */
.share-row{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.share-label{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-right:2px}
.share-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line-2);background:var(--chip-bg);color:var(--text);display:grid;place-items:center;cursor:pointer;transition:.15s;text-decoration:none}
.share-btn:hover{border-color:var(--cyan);background:rgba(34,211,238,.14);transform:translateY(-2px)}
.share-btn svg{width:18px;height:18px;stroke:var(--cyan)}
.share-btn.wa svg{stroke:none;fill:#25D366}
.share-btn.fb svg{stroke:none;fill:#1877F2}

/* ---------- cert verify link ---------- */
.cert-verify{display:inline-flex;align-items:center;gap:5px;margin-top:10px;font-family:var(--mono);font-size:11.5px;color:var(--cyan);text-decoration:none;letter-spacing:.5px}
.cert-verify:hover{text-decoration:underline}

/* ---------- footer ---------- */
footer{border-top:1px solid var(--line);padding:34px 24px;text-align:center;color:var(--muted);font-size:13.5px}
footer .mono{font-family:var(--mono);color:var(--cyan)}

/* ---------- reveal ---------- */
.reveal{opacity:0;transform:translateY(26px);transition:opacity .7s ease,transform .7s ease}
.reveal.visible{opacity:1;transform:none}

/* ---------- to top ---------- */
.to-top{position:fixed;right:22px;bottom:22px;z-index:40;width:46px;height:46px;border-radius:12px;border:1px solid var(--line-2);background:var(--float-bg);backdrop-filter:blur(8px);color:var(--cyan);display:grid;place-items:center;cursor:pointer;opacity:0;pointer-events:none;transition:.25s}
.to-top.show{opacity:1;pointer-events:auto}
.to-top:hover{background:rgba(34,211,238,.15)}

#toast{position:fixed;top:82px;left:50%;transform:translateX(-50%) translateY(-12px);z-index:70;padding:11px 20px;border-radius:11px;background:rgba(8,13,24,.97);border:1px solid var(--line-2);color:#9ff1d2;font-family:var(--mono);font-size:13px;box-shadow:0 14px 40px rgba(2,8,20,.6);opacity:0;pointer-events:none;transition:.25s}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* =====================================================================
   NEW JS-DRIVEN FEATURES
===================================================================== */
/* preloader */
.preloader{position:fixed;inset:0;z-index:200;background:#05070d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .6s ease,visibility .6s}
.preloader.hidden{opacity:0;visibility:hidden}
.pre-mark{width:104px;height:104px;border-radius:26px;padding:3px;background:conic-gradient(from 0deg,var(--cyan),var(--violet),var(--blue),var(--cyan));box-shadow:0 0 44px rgba(34,211,238,.28);animation:prePulse 1.4s ease-in-out infinite}
.pre-logo{width:100%;height:100%;border-radius:23px;display:grid;place-items:center;background:#0a1424}
.pre-logo span{font-family:var(--mono);font-weight:800;font-size:40px;letter-spacing:-2px;background:linear-gradient(135deg,var(--cyan),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.pre-bar{width:200px;height:3px;border-radius:3px;background:rgba(56,189,248,.15);overflow:hidden}
.pre-bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--violet));animation:preFill 1.5s ease forwards}
.pre-text{font-family:var(--mono);font-size:11px;letter-spacing:3px;color:#8fa6bd;text-transform:uppercase}
@keyframes prePulse{0%,100%{opacity:.6;transform:scale(.97)}50%{opacity:1;transform:scale(1.03)}}
@keyframes preFill{to{width:100%}}

/* scroll progress */
.scroll-progress{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--cyan),var(--violet));z-index:120;box-shadow:0 0 10px rgba(34,211,238,.6)}

/* mouse glow */
.mouse-glow{position:fixed;top:0;left:0;width:520px;height:520px;border-radius:50%;pointer-events:none;z-index:5;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(34,211,238,.08),rgba(99,102,241,.05) 40%,transparent 65%);opacity:0;transition:opacity .4s;will-change:transform}
body.mouse-on .mouse-glow{opacity:1}
[data-theme="light"] .mouse-glow{background:radial-gradient(circle,rgba(8,145,178,.12),rgba(124,92,220,.07) 40%,transparent 65%)}

/* ---------- responsive ---------- */
@media(max-width:1080px){
  .hero-inner{gap:32px}
  .certs-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:960px){
  .hero{min-height:0;padding-top:120px}
  .hero-inner{grid-template-columns:1fr;gap:40px}
  .hero-visual{order:-1;margin-top:0}
  .hero h1{font-size:clamp(38px,10vw,58px)}
  .grid-3,.skills-grid,.contact-wrap{grid-template-columns:1fr}
  .project-card{grid-template-columns:1fr}
  .project-visual{min-height:220px;border-right:none;border-bottom:1px solid var(--line)}
  .stats{grid-template-columns:repeat(2,1fr)}
  .float-tag{font-size:11px;padding:6px 10px}
  .float-tag.t1{left:-2%}
  .float-tag.t2{right:-4%}
  .float-tag.t3{right:-6%}
  .float-tag.t5{left:-6%}
}
@media(max-width:640px){
  .nav-links{display:none}
  .burger{display:block}
  .nav-inner{padding:0 16px;height:60px}
  .logo-photo{width:32px;height:32px}
  section{padding:64px 16px}
  .container{max-width:100%}
  h2.section-title{font-size:26px}
  .section-sub{font-size:15px}
  .hero{padding-top:96px}
  .hero-inner{gap:28px}
  .avatar-wrap{width:min(280px,86vw)}
  .avatar-ring{width:min(200px,62vw)}
  .float-tag{font-size:10.5px;padding:5px 9px}
  .float-tag.t1{top:4%;left:-8%}
  .float-tag.t2{bottom:14%;right:-10%}
  .float-tag.t3{top:46%;right:-12%}
  .float-tag.t4{top:10%;right:-10%}
  .float-tag.t5{bottom:32%;left:-12%}
  .float-tag.t6{top:30%;left:-12%}
  .hero-cta{flex-direction:column;gap:10px}
  .hero-cta .btn{justify-content:center;width:100%}
  .stats{grid-template-columns:1fr 1fr;gap:10px}
  .stat{padding:13px 10px}
  .card{padding:20px}
  .tl-card{padding:18px 16px}
  .tl-item{padding-left:16px}
  .timeline{padding-left:22px}
  .skill-group{padding:20px}
  .project-body{padding:20px}
  .project-links{flex-wrap:wrap;gap:8px}
  .project-links .btn{flex:1;justify-content:center;min-width:110px}
  .gallery{min-height:220px}
  .gal-nav{width:32px;height:32px;font-size:17px}
  .contact-card{padding:18px}
  .ci-val{font-size:14px;word-break:break-all}
  .contact-item{gap:11px}
  .share-row{gap:6px}
  .share-btn{width:40px;height:40px}
  .lb-img{max-width:96vw}
  .lb-thumb{width:48px;height:36px}
  .lb-nav.prev{left:6px}
  .lb-nav.next{right:6px}
  .lb-nav{width:40px;height:40px;font-size:22px}
  .custom-section{padding:64px 16px}
  .to-top{right:14px;bottom:14px}
  .code-panel{max-height:88vh}
  .code-pre{padding:14px;font-size:11.5px}
}
@media(max-width:380px){
  .stats{grid-template-columns:1fr 1fr}
  .stat .num{font-size:18px}
  .hero h1{font-size:34px}
  .float-tag{display:none}
  .avatar-wrap{width:min(240px,88vw)}
  .avatar-ring{width:min(170px,60vw)}
}

/* ---------- touch-friendly (mobile) ---------- */
@media(pointer:coarse){
  .btn,.ed-btn,.nav-cta{min-height:44px}
  .gal-dot{width:10px;height:10px}
  .burger{min-height:44px;min-width:44px}
}

/* ---------- landscape phones ---------- */
@media(max-height:500px) and (orientation:landscape){
  .hero{min-height:0}
  .avatar-wrap{width:min(200px,50vh)}
}

/* ---------- print ---------- */
@media print{
  :root,[data-theme="light"]{
    --bg:#ffffff;--bg-2:#ffffff;--panel:#ffffff;--panel-2:#ffffff;
    --line:#dddddd;--line-2:#bbbbbb;--cyan:#0891b2;--blue:#0284c7;--violet:#7c3aed;
    --text:#111111;--muted:#333333;--grid-line:transparent;
  }
  .bg-grid,.bg-glow,#particles,nav,.to-top,.preloader,.scroll-progress,.mouse-glow,#toast{display:none !important}
  body{background:#fff !important}
  section{padding:18px 0 !important;min-height:0 !important}
  .hero{padding-top:18px !important;min-height:0 !important}
  .hero-inner{grid-template-columns:1fr 1fr}
  .card,.project-card,.tl-card,.skill-group,.contact-card,.stat{border:1px solid #ccc;box-shadow:none !important;break-inside:avoid;background:#fff}
  .reveal{opacity:1 !important;transform:none !important}
  .project-card{display:block}
  .project-visual{border-right:none;min-height:auto}
  .project-body{padding:16px}
  a{color:#111;text-decoration:none}
  .eyebrow,.prole,.role,.issuer{color:#0891b2}
}

eSerial.h>\n\n// ================== BLUETOOTH ==================\nSoftwareSerial bluetooth(A2, A3); // RX, TX\n\n// ================== PINS ==================\n\n// Motor Driver - Right Wheels\n//#define EN_RIGHT  10\n#define IN1_RIGHT  8\n#define IN2_RIGHT  11\n\n// Motor Driver - Left Wheels\n//#define EN_LEFT    5\n#define IN3_LEFT   10\n#define IN4_LEFT   9\n\n// Pump Driver\n#define EN_PUMP    3\n#define IN1_PUMP   12\n#define IN2_PUMP   13\n\n// Flame Sensor\n#define FLAME_PIN A4\n\n// Servo Pins (Digital PWM pins)\n#define SERVO_H_PIN 4\n#define SERVO_V_PIN 7\n\n// ================== SETTINGS ==================\n\n#define FIRE_THRESHOLD  800   // فوق دي = مفيش نار\n#define FIRE_CLOSE      100   // تحت دي = نار قريبة جداً\n\n#define SCAN_MIN         30   // أقل زاوية للمسح الأفقي\n#define SCAN_MAX        150   // أعلى زاوية للمسح الأفقي\n#define CENTER_H         90   // المنتصف الأفقي\n\n#define V_MIN            40   // أقل زاوية رأسية\n#define V_MAX           130   // أعلى زاوية رأسية\n#define CENTER_V         90   // المنتصف الرأسي\n\n#define FIRE_LEFT       110   // فوق دي = النار على الشمال\n#define FIRE_RIGHT       70   // تحت دي = النار على اليمين\n\n#define MOTOR_SPEED     150\n#define PUMP_SPEED      255\n\n#define EXTINGUISH_TIMEOUT 8000  // 8 ثواني أقصى وقت للإطفاء\n\n// ================== OBJECTS ==================\n\nServo servoH;\nServo servoV;\n\n// ================== STATE MACHINE ==================\n\nenum State {\n  SEARCH,\n  ALIGN,\n  MOVE_FORWARD,\n  EXTINGUISH,\n  RESET\n};\n\nState state = SEARCH;\n\n// ================== VARIABLES ==================\n\nint  scanH       = CENTER_H;\nbool goingRight  = true;\nunsigned long lastScan = 0;\nunsigned long lastBTSend  = 0;  // وقت آخر رسالة Bluetooth\n\n// ================== SETUP ==================\n\nvoid setup() {\n  Serial.begin(9600);\n\n  // Motor pins\n  //pinMode(EN_RIGHT,  OUTPUT);\n  pinMode(IN1_RIGHT, OUTPUT); pinMode(IN2_RIGHT, OUTPUT);\n  //pinMode(EN_LEFT,   OUTPUT); \n  pinMode(IN3_LEFT,  OUTPUT); pinMode(IN4_LEFT,  OUTPUT);\n  pinMode(EN_PUMP,   OUTPUT); \n  pinMode(IN1_PUMP,  OUTPUT); pinMode(IN2_PUMP,  OUTPUT);\n\n  // Servos على Digital pins\n  servoH.attach(SERVO_H_PIN);\n  servoV.attach(SERVO_V_PIN);\n\n  // Baseline Calibration\n  bluetooth.println(\"Calibrating...\");\n  int sum = 0;\n  for (int i = 0; i \u003c 20; i++) {\n    sum += analogRead(FLAME_PIN);\n    delay(10);\n  }\n  int baseline  = sum / 20;\n  int fireThreshold = baseline - 150;\n  int fireClose     = baseline - 600;\n\n  bluetooth.print(\"Baseline: \");      bluetooth.println(baseline);\n  bluetooth.print(\"Fire Threshold: \"); bluetooth.println(fireThreshold);\n\n  resetSystems();\n  bluetooth.println(\"Robot Ready! Searching for fire...\");\n}\n\n// ================== MAIN LOOP ==================\n\nvoid loop() {\n  int flame = readFlame();\n\n  /*// بعت حالة العربية على الموبايل كل ثانية\n  if (millis() - lastBTSend > 5000) {\n    lastBTSend = millis();\n    sendBluetoothStatus(flame);\n  }*/\n\n  Serial.print(\"Flame: \"); Serial.print(flame);\n  Serial.print(\" | State: \"); Serial.println(state);\n\n  switch (state) {\n\n    // ========== SEARCH ==========\n    case SEARCH:\n      stopMotors();\n      scanHorizontal();\n\n      if (flame \u003c FIRE_THRESHOLD) {\n        bluetooth.println(\"--- ALERT: FIRE DETECTED! ---\"); // بتتبعت مرة واحدة بس لما يلقط نار       \n        state = ALIGN;\n      }\n      break;\n\n    // ========== ALIGN ==========\n    case ALIGN:\n      stopMotors();\n\n      if (scanH > FIRE_LEFT) {\n        turnLeft();\n        delay(250);\n        stopMotors();\n        delay(100);\n        // تأكد إن النار لسه موجودة بعد اللفة\n        if (readFlame() >= FIRE_THRESHOLD) state = SEARCH;\n\n      } else if (scanH \u003c FIRE_RIGHT) {\n        turnRight();\n        delay(250);\n        stopMotors();\n        delay(100);\n        if (readFlame() >= FIRE_THRESHOLD) state = SEARCH;\n\n      } else {\n        // النار في الوش\n        state = MOVE_FORWARD;\n      }\n      break;\n\n    // ========== MOVE FORWARD ==========\n    case MOVE_FORWARD:\n      moveForward();\n      delay(150);\n      if (flame \u003c FIRE_CLOSE) {\n        stopMotors();\n        state = EXTINGUISH;\n      }\n\n      // لو النار اختفت أثناء التقدم\n      if (flame >= FIRE_THRESHOLD) {\n        stopMotors();\n        state = SEARCH;\n      }\n      break;\n\n    // ========== EXTINGUISH ==========\n    case EXTINGUISH:\n    {\n      stopMotors();\n\n      // البحث عن أفضل زاوية رأسية (مش أول قيمة)\n      int bestV   = CENTER_V;\n      int bestVal = 1023;\n\n      for (int v = V_MIN; v \u003c= V_MAX; v += 2) {\n        servoV.write(v);\n        delay(30);\n        int val = readFlame();\n        if (val \u003c bestVal) {\n          bestVal = val;\n          bestV   = v;\n        }\n      }\n\n      servoV.write(bestV);\n      delay(300);\n\n      // Soft Start للمضخة (بيحمي المضخة من الـ current spike)\n      startPump();\n\n      // الإطفاء مع Timeout و Jiggling\n      unsigned long startTime = millis();\n      while (readFlame() \u003c 1000 && (millis() - startTime \u003c EXTINGUISH_TIMEOUT)) {\n        // Jiggling لتوزيع الميه حوالين مركز النار\n        servoH.write(scanH + 5); delay(150);\n        servoH.write(scanH - 5); delay(150);\n      }\n\n      stopPump();\n      bluetooth.println(\"--- SUCCESS: FIRE IS EXTINGUISHED ---\"); // بتتبعت لما يخلص إطفاء\n      bluetooth.println(\"--- SEARCHING FOR FIRE ! ---\"); // بتتبعت لما يخلص إطفاء\n      state = RESET;\n    }\n    break;\n\n    // ========== RESET ==========\n    case RESET:\n      resetSystems();\n      state = SEARCH;\n      break;\n  }\n}\n\n// ================== BLUETOOTH STATUS ==================\nvoid sendBluetoothStatus(int flame) {\n  String stateStr;\n  switch (state) {\n    case SEARCH:       stateStr = \"SEARCH\";       break;\n    case ALIGN:        stateStr = \"ALIGN\";         break;\n    case MOVE_FORWARD: stateStr = \"MOVING\";        break;\n    case EXTINGUISH:   stateStr = \"EXTINGUISHING\"; break;\n    case RESET:        stateStr = \"RESET\";         break;\n  }\n  bluetooth.println(\"===================\");\n  bluetooth.print(\"State : \"); bluetooth.println(stateStr);\n  bluetooth.print(\"Flame : \"); bluetooth.println(flame);\n  bluetooth.print(\"ServoH: \"); bluetooth.println(scanH);\n}\n\n// ================== SENSOR ==================\n\n// Average من 5 قراءات عشان نتلاشى الـ noise\nint readFlame() {\n  int sum = 0;\n  for (int i = 0; i \u003c 5; i++) {\n    sum += analogRead(FLAME_PIN);\n    delay(2);\n  }\n  return sum / 5;\n}\n\n// ================== SCAN ==================\n\n// مسح أفقي بـ millis() عشان الـ loop ميتوقفش\nvoid scanHorizontal() {\n  if (millis() - lastScan > 40) {\n    lastScan = millis();\n\n    if (goingRight) {\n      scanH += 2;\n      if (scanH >= SCAN_MAX) goingRight = false;\n    } else {\n      scanH -= 2;\n      if (scanH \u003c= SCAN_MIN) goingRight = true;\n    }\n\n    servoH.write(scanH);\n  }\n}\n\n// ================== RESET ==================\n\nvoid resetSystems() {\n  stopMotors();\n  stopPump();\n  scanH = CENTER_H;\n  servoH.write(CENTER_H);\n  servoV.write(CENTER_V);\n  delay(500);\n}\n\n// ================== PUMP ==================\n\nvoid startPump() {\n  digitalWrite(IN1_PUMP, HIGH);\n  digitalWrite(IN2_PUMP, LOW);\n  analogWrite(EN_PUMP, PUMP_SPEED);\n}\n\nvoid stopPump() {\n  analogWrite(EN_PUMP, 0);\n  digitalWrite(IN1_PUMP, LOW);\n  digitalWrite(IN2_PUMP, LOW);\n}\n\n// ================== MOTORS ==================\n\nvoid moveForward() {\n  digitalWrite(IN1_RIGHT, LOW); digitalWrite(IN2_RIGHT, HIGH);\n  digitalWrite(IN3_LEFT,  LOW); digitalWrite(IN4_LEFT, HIGH);\n}\n\nvoid turnRight() {\n  digitalWrite(IN1_RIGHT, LOW);  digitalWrite(IN2_RIGHT, HIGH);\n  digitalWrite(IN3_LEFT,  HIGH); digitalWrite(IN4_LEFT,  HIGH);\n}\n\nvoid turnLeft() {\n  digitalWrite(IN1_RIGHT, LOW); digitalWrite(IN2_RIGHT, LOW);\n  digitalWrite(IN3_LEFT,  LOW);  digitalWrite(IN4_LEFT,  HIGH);\n}\n\nvoid stopMotors() {\n  digitalWrite(IN1_RIGHT, LOW); digitalWrite(IN2_RIGHT, LOW);\n  digitalWrite(IN3_LEFT,  LOW); digitalWrite(IN4_LEFT,  LOW);\n}","attachments":[]},{"title":"Bus Management System","year":"2026","tag":"Automation","role":"Role: Automation & Workflow Developer","visual":"bus","bullets":["Developed an automated bus-management workflow that streamlines routing and scheduling logic.","Reduced manual coordination overhead by automating repetitive operational steps.","Explored workflow automation tools (n8n) and data flow design."],"github":"#","demo":"#","code":"","images":["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAADTLXBhcmEAAAAAAAQAAAACZmYAAPKnAAANWQAAE9AAAApbAAAAAAAAAABtbHVjAAAAAAAAAAEAAAAMZW5VUwAAACAAAAAcAEcAbwBvAGcAbABlACAASQBuAGMALgAgADIAMAAxADb/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAKWA4QDASIAAhEBAxEB/8QAHAABAAIDAQEBAAAAAAAAAAAAAAEEAgMFBgcI/8QAYBAAAQMCAwIGDAkKAwQHBwMFAQACAwQRBRIhBjEHExVBUZEUIjJSU1RhcYGhsdEWMzRyc5Ki0tMII0JilJWywcLwJGSTGDVjghclN0NFdbM2RFV0o8PhOFbxJnaEtOL/xAAaAQEBAQEBAQEAAAAAAAAAAAAAAQIDBAUG/8QAMhEBAAIBAwMDAgQFBQEBAAAAAAERAgMSMRMhUQQyQSJhFDNx8EJDgZGhBbHB0eEjFf/aAAwDAQACEQMRAD8A/MSIi7uQiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgK7RfFE891SXQpfiG+n2renyzlw2oiLuwIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgI   const o = Array.isArray(base) ? [] : {};
  for(const k in base){

    else if(over && over[k] !== undefined){ o[k] = deepClone(over[k]); }
    else { o[k] = deepClone(base[k]); }
  }
  if(over){ for(const k in over){ if(base[k] === undefined){ o[k] = deepClone(over[k]); } } }
  return o;
}

  if(/\.(mp4|webm|mov|m4v)(\?|$)/.test(name) || /\.(mp4|webm|mov|m4v)(\?|$)/.test(url)) return 'video-file';
  if(/\.pdf(\?|$)/.test(name) || /\.pdf(\?|$)/.test(url)) return 'pdf';
  if(/\.(png|jpe?g|gif|webp)(\?|$)/.test(name)) return 'image';
  if(/\.(xlsx|xls|csv|ods)(\?|$)/.test(name) || /\.(xlsx|xls|csv)(\?|$)/.test(url)) return 'excel';
  return 'file';
}

    const id = ++__attId;
    ATT_LOOKUP[id] = a;
    const k = attachmentKind(a);
    return '<button class="att-chip" data-attid="'+id+'" title="'+esc(attLabel(a))+'">'+(icons[k]||'📎')+' <span>'+esc(attLabel(a))+'</span></button>';
  }).join('');
  return '<div class="attachments">'+chips+'</div>';
}
function embedUrl(u){
  u = u || '';
  var m;
  if(u.indexOf('youtu') !== -1){
    m = u.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{6,})/);
    if(m) return 'https://www.youtube.com/embed/' + m[1];
  }
  if(u.indexOf('vimeo.com') !== -1){
    m = u.match(/vimeo\.com\/(?:video\/)?(\d+)/);
    if(m) return 'https://player.vimeo.com/video/' + m[1];
  }
  return u;
}
function downloadData(src, name){
  var a = document.createElement('a');
  a.href = src;
  a.download = name || 'file';
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ document.body.removeChild(a); }, 300);
}
function openAttachment(id){
  const a = ATT_LOOKUP[id];
  if(!a) return;
  const k = attachmentKind(a);
  const src = attSrc(a);
  const name = attLabel(a);
  if(k === 'excel' || k === 'file'){ downloadData(src, name); return; }
  openMedia(k, src, name);
}
function openMedia(kind, src, name){
  const stage = document.getElementById('mediaStage');
  const title = document.getElementById('mediaTitle');
  if(!stage) return;
  title.textContent = name;
  if(kind === 'video-embed'){ stage.innerHTML = '<iframe src="'+esc(embedUrl(src))+'" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>'; }
  else if(kind === 'video-file'){ stage.innerHTML = '<video src="'+esc(src)+'" controls autoplay playsinline></video>'; }
  else if(kind === 'pdf'){ stage.innerHTML = '<iframe class="pdf-frame" src="'+esc(src)+'"></iframe>'; }
  else if(kind === 'image'){ stage.innerHTML = '<img src="'+esc(src)+'" alt="'+esc(name)+'">'; }
  else if(kind === 'text'){ stage.innerHTML = '<div class="media-text">'+esc(src)+'</div>'; }
  else { stage.innerHTML = '<div class="media-fallback">📎 '+esc(name)+'</div>'; }
  document.getElementById('mediaModal').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeMedia(){
  const mm = document.getElementById('mediaModal');
  if(!mm) return;
  mm.classList.remove('open');
  document.getElementById('mediaStage').innerHTML = '';
  document.body.style.overflow = '';
}

/* ---------- demo field: accepts a link OR plain text ---------- */
function openDemo(value, title){
  const v = String(value == null ? "" : value).trim();
  if(!v || v === '#') return;
  const label = (title || 'Demo');
  if(/^https?:\/\//i.test(v)){
    const k = attachmentKind({ name: v, url: v });
    if(k === 'video-embed' || k === 'video-file' || k === 'pdf' || k === 'image'){
      openMedia(k, v, label);
      return;
    }
    window.open(v, '_blank', 'noopener');
    return;
  }
  if(/^data:video/i.test(v)){ openMedia('video-file', v, label); return; }
  if(/^data:application\/pdf/i.test(v)){ openMedia('pdf', v, label); return; }
  if(/^data:image/i.test(v)){ openMedia('image', v, label); return; }
  if(/^data:/i.test(v)){ downloadData(v, 'demo'); return; }
  // plain text -> show it in a readable modal
  openMedia('text', v, label);
}

let typeTimer = null;
function startTyping(){
  if(typeTimer) clearTimeout(typeTimer);
  const el = document.getElementById('typed');
  if(!el) return;
  const words = (CONTENT.hero.typeWords && CONTENT.hero.typeWords.length ? CONTENT.hero.typeWords : [' ']).map(w=>t(w));
  let wi=0, ci=0, del=false;
  function tick(){
    const w = words[wi] || ' ';
    el.textContent = w.slice(0, ci);
    if(!del){ ci++; if(ci > w.length){ del=true; typeTimer=setTimeout(tick,1500); return; } typeTimer=setTimeout(tick,75); }
    else { ci--; if(ci < 0){ del=false; wi=(wi+1)%words.length; ci=0; } typeTimer=setTimeout(tick,38); }
  }
  tick();
}

let counterObserver = null, revealObserver = null;
function setupObservers(){
  if(revealObserver) revealObserver.disconnect();
  if(counterObserver) counterObserver.disconnect();
  revealObserver = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('visible'); revealObserver.unobserve(e.target); } });
  },{threshold:.12});
  document.querySelectorAll('.reveal').forEach(el=>revealObserver.observe(el));
  counterObserver = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      if(!e.isIntersecting) return;
      animateCount(e.target);
      counterObserver.unobserve(e.target);
    });
  },{threshold:.5});
  document.querySelectorAll('.num[data-count]').forEach(el=>counterObserver.observe(el));
}
function animateCount(el){
  const target = parseFloat(el.dataset.count) || 0, dec = +(el.dataset.dec||0);
  const t0 = performance.now(), dur = 1300;
  function step(t){
    const p = Math.min((t-t0)/dur, 1);
    const eased = 1-Math.pow(1-p,3);
    el.textContent = (target*eased).toFixed(dec);
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function finePointer(){
  if(window.matchMedia){
    try{ return window.matchMedia('(hover:hover) and (pointer:fine)').matches; }catch(e){ return true; }
  }
  return true;
}
(function(){
  const mg = document.getElementById('mouseGlow');
  if(!mg || !finePointer() || window.innerWidth < 900) return;
  document.body.classList.add('mouse-on');
  let mx = window.innerWidth/2, my = window.innerHeight/2, gx = mx, gy = my, raf = null;
  window.addEventListener('mousemove', function(e){
    mx = e.clientX; my = e.clientY;
    if(!raf){ raf = requestAnimationFrame(function loop(){ gx += (mx-gx)*.12; gy += (my-gy)*.12; mg.style.transform = 'translate('+(gx-260)+'px,'+(gy-260)+'px)'; raf = requestAnimationFrame(loop); }); }
  });
})();
let tiltTarget = null;
document.addEventListener('mousemove', function(e){
  if(!finePointer()) return;
  const card = e.target.closest('.project-card');
  if(card){
    tiltTarget = card;
    const r = card.getBoundingClientRect();
    const x = (e.clientX - r.left)/r.width - .5;
    const y = (e.clientY - r.top)/r.height - .5;
    card.style.transform = 'perspective(900px) rotateX('+(-y*5)+'deg) rotateY('+(x*7)+'deg)';
    card.style.transition = 'transform .1s';
  } else if(tiltTarget){
    tiltTarget.style.transform = '';
    tiltTarget.style.transition = 'transform .5s';
    tiltTarget = null;
  }
});
const bursts = [];
document.addEventListener('pointerdown', function(e){
  for(let i=0;i<14;i++){
    const a = Math.random()*Math.PI*2, sp = 1 + Math.random()*2.5;
    bursts.push({ x:e.clientX, y:e.clientY, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1 });
  }
});

/* =====================================================================
   PARTICLES
===================================================================== */
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let W,H,pts=[];
function resize(){ W=canvas.width=window.innerWidth; H=canvas.height=window.innerHeight; }
resize(); window.addEventListener('resize', resize);
const N = Math.min(70, Math.floor(window.innerWidth/18));
for(let i=0;i<N;i++) pts.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,r:Math.random()*1.6+.4,o:Math.random()*.5+.15});
function draw(){
  ctx.clearRect(0,0,W,H);
  for(const p of pts){
    p.x+=p.vx; p.y+=p.vy;
    if(p.x<0||p.x>W) p.vx*=-1;
    if(p.y<0||p.y>H) p.vy*=-1;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle='rgba('+PARTICLE_RGB+','+p.o+')'; ctx.fill();
  }
  for(let i=0;i<pts.length;i++) for(let j=i+1;j<pts.length;j++){
    const dx=pts[i].x-pts[j].x, dy=pts[i].y-pts[j].y, d=Math.hypot(dx,dy);
    if(d<120){ ctx.beginPath(); ctx.moveTo(pts[i].x,pts[i].y); ctx.lineTo(pts[j].x,pts[j].y); ctx.strokeStyle='rgba('+PARTICLE_RGB+','+(0.08*(1-d/120))+')'; ctx.lineWidth=1; ctx.stroke(); }
  }
  for(let k=bursts.length-1;k>=0;k--){
    const b = bursts[k];
    b.x+=b.vx; b.y+=b.vy; b.vy+=0.05; b.life-=0.02;
    if(b.life<=0){ bursts.splice(k,1); continue; }
    ctx.beginPath(); ctx.arc(b.x,b.y,2.2*b.life+0.4,0,Math.PI*2);
    ctx.fillStyle='rgba('+PARTICLE_RGB+','+(b.life*.8)+')'; ctx.fill();
  }
  requestAnimationFrame(draw);
}
draw();

/* share buttons */
function shareNow(type, el){
  const url = encodeURIComponent(location.href);
  const text = encodeURIComponent(document.title);
  if(type === 'copy'){
    const copyText = location.href;
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(copyText).then(function(){ flash(t('Copy link')+' ✓'); }, function(){ flash('Copy failed'); });
    } else {
      const ta = document.createElement('textarea');
      ta.value = copyText; document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); flash(t('Copy link')+' ✓'); }catch(err){ flash('Copy failed'); }
      document.body.removeChild(ta);
    }
  } else if(type === 'whatsapp'){
    window.open('https://wa.me/?text='+text+'%20'+url, '_blank');
  } else if(type === 'linkedin'){
    window.open('https://www.linkedin.com/sharing/share-offsite/?url='+url, '_blank');
  } else if(type === 'facebook'){
    window.open('https://www.facebook.com/sharer/sharer.php?u='+url, '_blank');
  }
}

===================================================================== */
let lbState = null;
function galleryIndex(g){
  const imgs = g.querySelectorAll('.gal-img');
  for(let k=0;k<imgs.length;k++) if(imgs[k].classList.contains('active')) return k;
  return 0;
}
function setGallerySlide(g, idx){
  const imgs = g.querySelectorAll('.gal-img');
  const dots = g.querySelectorAll('.gal-dot');
  if(!imgs.length) return idx;
  const n = imgs.length;
  idx = ((idx % n) + n) % n;
  imgs.forEach((im,k)=> im.classList.toggle('active', k===idx));
  dots.forEach((d,k)=> d.classList.toggle('active', k===idx));
  const c = g.querySelector('[data-gal-idx]');
  if(c) c.textContent = (idx+1);
  return idx;
}
function lbRender(){
  if(!lbState) return;
  document.getElementById('lbImg').src = lbState.imgs[lbState.idx];
  document.getElementById('lbCount').textContent = (lbState.idx+1)+' / '+lbState.imgs.length;
  document.getElementById('lbCaption').textContent = (lbState.title||'Project')+' — Photo '+(lbState.idx+1);
  document.getElementById('lbThumbs').innerHTML = lbState.imgs.map((s,k)=>
    '<button class="lb-thumb'+(k===lbState.idx?' active':'')+'" data-i="'+k+'"><img src="'+s+'" alt=""></button>').join('');
}
function openLightbox(projectIndex, slideIndex){
  const pr = CONTENT.projects.items[projectIndex];
  const imgs = pr ? projectImages(pr) : [];
  if(!imgs.length) return;
  lbState = { idx: slideIndex, imgs: imgs, title: pr ? pr.title : '' };
  lbRender();
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
  lbState = null;
}
function openCode(title, code){
  document.getElementById('codeTitle').textContent = title;
  document.getElementById('codePre').textContent = code;
  document.getElementById('codeModal').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeCode(){
  document.getElementById('codeModal').classList.remove('open');
  document.body.style.overflow = '';
}
function flash(msg){
  const el = document.getElementById('toast');
  if(!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(flash._t);
  flash._t = setTimeout(()=> el.classList.remove('show'), 2200);
}
document.getElementById('codeCopy').addEventListener('click', function(){
  const t = document.getElementById('codePre').textContent;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(()=> flash('Code copied ✓')).catch(()=> flash('Copy failed'));
  } else {
    const ta = document.createElement('textarea');
    ta.value = t; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); flash('Code copied ✓'); }catch(e){ flash('Copy failed'); }
    document.body.removeChild(ta);
  }
});

document.addEventListener('click', function(e){
  const attChip = e.target.closest('.att-chip');
  if(attChip){
    e.preventDefault();
    openAttachment(attChip.dataset.attid);
    return;
  }
  if(e.target.closest('#mediaClose')){ closeMedia(); return; }
  if(e.target.id === 'mediaModal'){ closeMedia(); return; }
  const shareBtn = e.target.closest('[data-share]');
  if(shareBtn){
    e.preventDefault();
    shareNow(shareBtn.dataset.share, shareBtn);
    return;
  }
  const nav = e.target.closest('.gal-nav');
  if(nav){
    const g = nav.closest('[data-gallery]');
    if(g) setGallerySlide(g, galleryIndex(g) + (nav.classList.contains('next') ? 1 : -1));
    return;
  }
  const dot = e.target.closest('.gal-dot');
  if(dot){
    const g = dot.closest('[data-gallery]');
    if(g) setGallerySlide(g, parseInt(dot.dataset.i, 10));
    return;
  }
  const stage = e.target.closest('.gal-stage');
  if(stage){
    const g = stage.closest('[data-gallery]');
    if(g) openLightbox(parseInt(g.dataset.project, 10), galleryIndex(g));
    return;
  }
  const thumb = e.target.closest('.lb-thumb');
  if(thumb){ if(lbState){ lbState.idx = parseInt(thumb.dataset.i, 10); lbRender(); } return; }
  if(e.target.closest('#lbClose')){ closeLightbox(); return; }
  if(e.target.closest('#lbPrev')){ if(lbState){ lbState.idx = (lbState.idx-1+lbState.imgs.length)%lbState.imgs.length; lbRender(); } return; }
  if(e.target.closest('#lbNext')){ if(lbState){ lbState.idx = (lbState.idx+1)%lbState.imgs.length; lbRender(); } return; }
  if(e.target.id === 'lightbox'){ closeLightbox(); }

  const codeBtn = e.target.closest('.code-open');
  if(codeBtn){
    const idx = parseInt(codeBtn.dataset.index, 10);
    const pr = CONTENT.projects.items[idx];
    if(pr && pr.code) openCode(pr.title + ' — Code', pr.code);
    return;
  }
  const demoBtn = e.target.closest('.demo-open');
  if(demoBtn){
    const idx = parseInt(demoBtn.dataset.index, 10);
    const pr = CONTENT.projects.items[idx];
    if(pr) openDemo(pr.demo, pr.title + ' — Demo');
    return;
  }
  const fieldBtn = e.target.closest('.field-open');
  if(fieldBtn){
    const idx = parseInt(fieldBtn.dataset.index, 10);
    const fi = parseInt(fieldBtn.dataset.fi, 10);
    const pr = CONTENT.projects.items[idx];
    if(pr && pr.fields && pr.fields[fi]){
      openDemo(pr.fields[fi].value, pr.fields[fi].label);
    }
    return;
  }
  if(e.target.closest('#codeClose')){ closeCode(); return; }
  if(e.target.id === 'codeModal'){ closeCode(); }
});

document.addEventListener('keydown', function(e){
  if(document.getElementById('mediaModal').classList.contains('open')){
    if(e.key === 'Escape') closeMedia();
    return;
  }
  if(document.getElementById('codeModal').classList.contains('open')){
    if(e.key === 'Escape') closeCode();
    return;
  }
  if(!lbState) return;
  if(e.key === 'Escape') closeLightbox();
  else if(e.key === 'ArrowLeft'){ lbState.idx = (lbState.idx-1+lbState.imgs.length)%lbState.imgs.length; lbRender(); }
  else if(e.key === 'ArrowRight'){ lbState.idx = (lbState.idx+1)%lbState.imgs.length; lbRender(); }
});
