<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 — Page Not Found</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#05070d;color:#e6f1fb;font-family:"Segoe UI",system-ui,Arial,sans-serif;text-align:center;padding:20px}
  .wrap{border:1px solid rgba(56,189,248,.3);border-radius:22px;padding:48px 40px;background:linear-gradient(180deg,rgba(15,26,46,.55),rgba(12,21,36,.35));max-width:480px}
  .code{font-family:ui-monospace,Consolas,monospace;font-weight:800;font-size:88px;background:linear-gradient(135deg,#22d3ee,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
  h1{font-size:22px;margin:8px 0 10px}
  p{color:#8fa6bd;font-size:14.5px;margin-bottom:24px;line-height:1.6}
  a{display:inline-block;padding:12px 24px;border-radius:11px;background:linear-gradient(135deg,#22d3ee,#38bdf8);color:#04121c;font-weight:700;text-decoration:none;font-size:14.5px}
  a:hover{transform:translateY(-2px)}
</style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or has been moved.<br>Let's get you back to the portfolio.</p>
    <a href="index.html">← Back to Home</a>
  </div>
</body>
</html>
