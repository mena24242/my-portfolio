<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Dashboard — Mena Medhat Portfolio</title>
<script src="supabase-config.js"></script>
<style>
:root{--bg:#0b0f1a;--panel:#111827;--panel2:#0f172a;--line:rgba(148,163,184,.14);--text:#e5e7eb;--muted:#94a3b8;--acc:#38bdf8;--acc2:#22d3ee;--ok:#34d399;--err:#fb7185;--warn:#fbbf24;--sans:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
a{color:var(--acc)}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:14px;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;outline:none;transition:border .15s}
input:focus,textarea:focus,select:focus{border-color:var(--acc)}
textarea{min-height:90px;resize:vertical}
textarea.code{font-family:var(--mono);font-size:12.5px;min-height:160px;white-space:pre}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600;letter-spacing:.02em}
.f{margin-bottom:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.row,.row3{grid-template-columns:1fr}}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
/* login */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 600px at 20% -10%,rgba(56,189,248,.12),transparent),var(--bg);z-index:50}
.login-card{width:min(420px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:32px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.login-card h1{font-size:22px;margin-bottom:4px}
.login-card p{color:var(--muted);font-size:13px;margin-bottom:22px}
.status{margin-top:12px;font-size:12.5px;padding:10px 12px;border-radius:10px;background:rgba(148,163,184,.08);color:var(--muted);word-break:break-word}
.status.err{background:rgba(251,113,133,.12);color:var(--err)}
.status.ok{background:rgba(52,211,153,.12);color:var(--ok)}
/* app */
#app{display:none;min-height:100%}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 18px;background:rgba(11,15,26,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header .brand{font-weight:800;letter-spacing:.02em}
header .brand small{display:block;font-weight:500;color:var(--muted);font-size:11px}
header .sp{flex:1}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:6px}
.dot.dirty{background:var(--warn)}
.dot.off{background:var(--err)}
#syncLabel{font-size:12px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:9px 14px;border-radius:10px;font-weight:600;font-size:13px;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--acc);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#04121c;border:none}
.btn.danger{color:var(--err)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.mini{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:6px 11px;border-radius:8px;font-size:12px;font-weight:600}
.mini:hover{border-color:var(--acc)}
.mini.danger{color:var(--err)}
.layout{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 58px)}
@media(max-width:900px){.layout{grid-template-columns:1fr}#tabs{flex-direction:row;overflow-x:auto;position:static!important;height:auto!important;border-right:none!important;border-bottom:1px solid var(--line)}#tabs .tab{white-space:nowrap}}
#tabs{display:flex;flex-direction:column;gap:2px;padding:14px 10px;border-right:1px solid var(--line);position:sticky;top:58px;height:calc(100vh - 58px);overflow-y:auto}
.tab{display:flex;align-items:center;gap:10px;text-align:left;background:none;border:none;color:var(--muted);padding:10px 12px;border-radius:10px;font-weight:600;font-size:13px}
.tab:hover{background:rgba(148,163,184,.07);color:var(--text)}
.tab.active{background:rgba(56,189,248,.12);color:var(--acc)}
.tab .em{font-size:16px;width:22px;text-align:center}
main{padding:26px 28px 120px;max-width:1080px}
main h2{font-size:22px;margin-bottom:6px}
.desc{color:var(--muted);font-size:13px;margin-bottom:22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px}
.card h3{display:flex;align-items:center;gap:12px;font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--acc);margin-bottom:16px}
.card h3 .line{flex:1;height:1px;background:var(--line)}
.item{border:1px dashed var(--line);border-radius:14px;padding:16px;margin-bottom:14px;background:rgba(15,23,42,.5)}
.it-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.it-head b{flex:1;font-size:13px;color:var(--muted)}
.chip-row{display:flex;flex-wrap:wrap;gap:8px}
.chip-edit{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);padding:5px 6px 5px 10px;border-radius:999px;font-size:13px}
.chip-edit button{background:none;border:none;color:var(--err);font-size:15px;line-height:1}
.switch-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;color:var(--text);font-weight:500}
.switch-row:last-child{border-bottom:none}
.switch-row input{width:18px;height:18px;accent-color:var(--acc)}
.avatar{width:110px;height:110px;border-radius:50%;object-fit:cover;border:3px solid var(--acc);background:var(--panel2)}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumb{position:relative;width:88px;height:66px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.65);color:#fff;border:none;border-radius:6px;font-size:11px;padding:2px 6px}
.att{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px;font-size:13px}
.att span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att small{color:var(--muted)}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--panel);border:1px solid var(--line);color:var(--text);padding:12px 18px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:92vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{border-color:var(--err);color:var(--err)}
.preview-frame{width:100%;height:78vh;border:1px solid var(--line);border-radius:14px;background:#000}
.preview-frame.mobile{width:390px;max-width:100%;margin:0 auto;display:block}
.banner{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.35);color:var(--warn);padding:12px 14px;border-radius:12px;font-size:13px;margin-bottom:18px}
code{font-family:var(--mono);background:rgba(148,163,184,.12);padding:2px 6px;border-radius:6px;font-size:12px}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);padding:1px 5px;border-radius:5px;color:var(--muted)}
input[type=color]{padding:4px;height:42px;cursor:pointer}
.swatches{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.swatch{width:36px;height:36px;border-radius:10px;border:2px solid transparent;cursor:pointer;transition:.15s;padding:0}
.swatch:hover{transform:translateY(-2px)}
.swatch.active{border-color:var(--text);transform:scale(1.1)}
.swatch .tick{color:#fff;font-size:13px;font-weight:800;text-shadow:0 1px 3px rgba(0,0,0,.6);line-height:32px}
/* analytics + messages */
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat .l{font-size:12px;color:var(--muted)}
.stat .n{display:block;font-size:26px;font-weight:800;margin-top:2px}
.chart{display:flex;align-items:flex-end;gap:3px;height:170px;margin-top:10px}
.chart-col{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px}
.chart-bar{width:100%;max-width:20px;border-radius:4px 4px 0 0;background:linear-gradient(180deg,var(--acc),var(--acc2));min-height:2px}
.chart-lbl{font-size:9px;color:var(--muted);height:11px;white-space:nowrap}
.badge{display:inline-block;font-size:10.5px;font-weight:700;padding:2.5px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.badge.new{color:var(--acc);border-color:rgba(56,189,248,.4);background:rgba(56,189,248,.1)}
.badge.replied{color:var(--ok);border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.1)}
.msg{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;background:rgba(15,23,42,.5)}
.msg.unread{border-left:3px solid var(--acc)}
.msg-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.msg-head b{font-size:13.5px}
.msg-head .em{color:var(--muted);font-size:12.5px;word-break:break-all}
.msg-head time{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap}
.msg-text{font-size:13.5px;white-space:pre-wrap;word-break:break-word}
.msg-actions{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
pre.snip{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-family:var(--mono);font-size:12px;line-height:1.55;overflow-x:auto;margin-top:8px}
/* visitor rows (analytics: who is reading the site, and from where) */
.vrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:8px;background:var(--panel2);font-size:13px}
.vrow .vid{font-family:var(--mono);font-size:12px;color:var(--muted)}
.vrow .loc{font-weight:700}
.vrow .sub{color:var(--muted);font-size:12px}
.vrow time{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login">
  <form class="login-card" id="loginForm">
    <h1>🔐 Portfolio Dashboard</h1>
    <p>Everything you save here goes straight to Supabase and appears on the live site.</p>
    <div class="f"><label>Password</label><input id="pw" type="password" placeholder="Dashboard password" autocomplete="current-password" autofocus></div>
    <button class="btn primary" type="submit" style="width:100%;justify-content:center" id="loginBtn">Sign in</button>
    <div class="status" id="loginStatus">Checking connection…</div>
  </form>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <header>
    <div class="brand">Mena Medhat <small>Portfolio dashboard · Supabase</small></div>
    <div class="sp"></div>
    <span id="syncLabel"><span class="dot" id="dot"></span>Synced</span>
    <button class="btn" data-act="reload" title="Discard local edits and reload from the database">↻ Reload</button>
    <button class="btn primary" data-act="save" id="saveBtn">💾 Save to Supabase</button>
    <button class="btn" data-act="logout">Logout</button>
  </header>

  <div class="layout">
    <aside id="tabs"></aside>
    <main id="main"></main>
  </div>
</div>

<div id="toast"></div>
<input type="file" id="fileInput" style="display:none">

<script>
/* =====================================================================
   SUPABASE CLIENT (REST + RPC, no SDK needed)
===================================================================== */
const SB_URL = (window.SUPABASE_URL || '').replace(/\/$/, '');
const SB_KEY = window.SUPABASE_ANON_KEY || '';
const SESSION_KEY = 'mm_dash_session';   /* password kept in sessionStorage only for this tab */

function sbHeaders(extra){
  return Object.assign({ apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' }, extra || {});
}
async function sbRpc(fn, args){
  const r = await fetch(SB_URL + '/rest/v1/rpc/' + fn, { method: 'POST', headers: sbHeaders(), body: JSON.stringify(args || {}) });
  const txt = await r.text();
  let data = null; try{ data = txt ? JSON.parse(txt) : null; }catch(e){ data = txt; }
  if(!r.ok){
    const msg = (data && (data.message || data.hint || data.details)) || ('HTTP ' + r.status);
    throw new Error(msg);
  }
  return data;
}
async function sbLoad(){
  const r = await fetch(SB_URL + '/rest/v1/portfolio?id=eq.main&select=content,updated_at', { headers: sbHeaders(), cache: 'no-store' });
  if(!r.ok) throw new Error('HTTP ' + r.status + ' — did you run setup.sql?');
  const rows = await r.json();
  return rows && rows[0] ? rows[0] : { content: {}, updated_at: null };
}

/* =====================================================================
   STATE
===================================================================== */
let CONTENT = null;          /* the full portfolio JSON */
let PASSWORD = '';
let dirty = false;
let currentTab = 'hero';
let lastSaved = null;

const EMPTY_CONTENT = {
  brand:{name:'',tag:''},
  hero:{pill:'',hello:"Hi, I'm",name:'',typePrefix:'',typeWords:[],lead:'',tags:[],stats:[]},
  cv:{name:'',data:'',visible:true},
  about:{eyebrow:'About Me',title:'',sub:'',cards:[]},
  education:{eyebrow:'Education',title:'Academic Background',items:[]},
  experience:{eyebrow:'Experience',title:"Where I've Applied It",items:[]},
  services:{eyebrow:'Services',title:'What I Do',sub:'',items:[]},
  skills:{eyebrow:'Skills',title:'Toolbox & Expertise',sub:'',groups:[]},
  projects:{eyebrow:'Projects',title:'Selected Work',sub:'',items:[]},
  certifications:{eyebrow:'Certifications & Awards',title:'Credentials',sub:'',certs:[]},
  testimonials:{eyebrow:'Testimonials',title:'What People Say',sub:'',items:[]},
  contact:{eyebrow:'Contact',title:"Let's Build Something",sub:'',email:'',phone:'',phoneDisplay:'',linkedin:'',linkedinUrl:'',github:'',githubUrl:'',location:''},
  footer:{line1:'',line2:''},
  settings:{accent:'cyan',gtagId:'',metaPixelId:'',web3formsKey:'',cvUrl:'',cvLabel:'',sections:{about:true,education:true,experience:true,services:true,skills:true,projects:true,certifications:true,testimonials:false,contact:true}},
  design:{theme:'auto',colors:{accent:'cyan',custom:'#22d3ee'},font:'system',animations:'full',layout:{width:'normal',spacing:'normal'},navbar:{style:'glass',sticky:true},background:{style:'grid',particles:true,glow:true},cards:{style:'glass',radius:'md',hover:true},buttons:{style:'gradient',radius:'rounded'},footer:{visible:true,style:'default'}},
  custom:{sections:[]}
};
function deepClone(x){ return JSON.parse(JSON.stringify(x)); }
function deepMerge(base, over){
  const o = Array.isArray(base) ? [] : {};
  for(const k in base){
    if(over && over[k] !== undefined && typeof over[k] === 'object' && over[k] !== null && !Array.isArray(over[k]) && typeof base[k] === 'object' && base[k] !== null && !Array.isArray(base[k])) o[k] = deepMerge(base[k], over[k]);
    else if(over && over[k] !== undefined) o[k] = deepClone(over[k]);
    else o[k] = deepClone(base[k]);
  }
  if(over) for(const k in over) if(base[k] === undefined) o[k] = deepClone(over[k]);
  return o;
}
function getPath(obj, path){ return path.split('.').reduce((o,k)=> (o == null ? undefined : o[k]), obj); }
function setPath(obj, path, val){ const ks = path.split('.'); let o = obj; for(let i=0;i<ks.length-1;i++){ if(o[ks[i]] == null || typeof o[ks[i]] !== 'object') o[ks[i]] = {}; o = o[ks[i]]; } o[ks[ks.length-1]] = val; }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function arr(path){ let a = getPath(CONTENT, path); if(!Array.isArray(a)){ a = []; setPath(CONTENT, path, a); } return a; }
function fmtSize(n){ return n > 1048576 ? (n/1048576).toFixed(2)+' MB' : Math.round(n/1024)+' KB'; }
function contentSize(){ return new Blob([JSON.stringify(CONTENT)]).size; }

function markDirty(){ dirty = true; document.getElementById('dot').className = 'dot dirty'; document.getElementById('syncLabel').lastChild.textContent = 'Unsaved changes'; }
function markClean(){ dirty = false; document.getElementById('dot').className = 'dot'; document.getElementById('syncLabel').lastChild.textContent = lastSaved ? ('Synced · ' + new Date(lastSaved).toLocaleString()) : 'Synced'; }
window.addEventListener('beforeunload', e => { if(dirty){ e.preventDefault(); e.returnValue = ''; } });

let toastTimer;
function flash(msg, kind){ const t = document.getElementById('toast'); t.textContent = msg; t.className = 'show' + (kind === 'err' ? ' err' : ''); clearTimeout(toastTimer); toastTimer = setTimeout(()=> t.className = '', 3200); }

/* =====================================================================
   LOGIN
===================================================================== */
const loginStatus = document.getElementById('loginStatus');
function setLoginStatus(msg, kind){ loginStatus.textContent = msg; loginStatus.className = 'status' + (kind ? ' ' + kind : ''); }

(async function boot(){
  if(!SB_URL || !SB_KEY){
    setLoginStatus('⚠️ supabase-config.js is empty. Put your Project URL and anon key there first.', 'err');
    document.getElementById('loginBtn').disabled = true;
    return;
  }
  try{ await sbLoad(); setLoginStatus('Connected to Supabase ✓', 'ok'); }
  catch(e){ setLoginStatus('Cannot reach the database: ' + e.message, 'err'); }
  const saved = sessionStorage.getItem(SESSION_KEY);
  if(saved){ document.getElementById('pw').value = saved; login(saved); }
})();

document.getElementById('loginForm').addEventListener('submit', e => { e.preventDefault(); login(document.getElementById('pw').value); });

async function login(pw){
  const btn = document.getElementById('loginBtn'); btn.disabled = true; setLoginStatus('Signing in…');
  try{
    const ok = await sbRpc('check_password', { p_password: pw });
    if(ok !== true){ setLoginStatus('Wrong password', 'err'); sessionStorage.removeItem(SESSION_KEY); btn.disabled = false; return; }
    PASSWORD = pw; sessionStorage.setItem(SESSION_KEY, pw);
    await loadFromDb();
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    buildTabs(); renderTab('hero');
  }catch(e){ setLoginStatus('Error: ' + e.message, 'err'); }
  btn.disabled = false;
}

async function loadFromDb(){
  const row = await sbLoad();
  const remote = row.content || {};
  lastSaved = row.updated_at;
  CONTENT = deepMerge(deepClone(EMPTY_CONTENT), remote);
  /* legacy: rows saved before Portfolio Control keep their old accent choice */
  if(!remote.design && remote.settings && remote.settings.accent && CONTENT.design) CONTENT.design.colors.accent = remote.settings.accent;
  CONTENT.__empty = !Object.keys(remote).length;
  markClean();
}

/* =====================================================================
   SAVE / RELOAD / IMPORT / EXPORT
===================================================================== */
/* the baked-content marker inside index.html.
   Found by scanning braces (never by `[^;]*`): project code stored in the JSON
   contains `;` characters — a regex that stops at the first one truncates the
   content and leaves dead junk behind on the same line. */
function findBaked(html){
  const i = html.indexOf('window.__BAKED_CONTENT__');
  if(i < 0) return null;
  const s = html.indexOf('{', i);
  if(s < 0) return null;
  let depth = 0, inStr = false, q = '', esc = false;
  for(let k = s; k < html.length; k++){
    const c = html[k];
    if(inStr){
      if(esc){ esc = false; continue; }
      if(c === '\\'){ esc = true; continue; }
      if(c === q){ inStr = false; }
      continue;
    }
    if(c === '"' || c === "'"){ inStr = true; q = c; continue; }
    if(c === '{'){ depth++; }
    else if(c === '}'){ depth--; if(depth === 0) return { start: i, open: s, end: k + 1, src: html.slice(s, k + 1) }; }
  }
  return null;
}
function bakeLine(){
  const payload = deepClone(CONTENT); delete payload.__empty;
  return 'window.__BAKED_CONTENT__ = ' + JSON.stringify(payload).replace(/</g, '\\u003c') + ';';
}
function bakeInto(html, line){
  const f = findBaked(html);
  if(!f) return html.replace('const STORE_KEY', line + '\nconst STORE_KEY');
  let after = f.end;
  if(html[after] === ';') after++;
  const nl = html.indexOf('\n', after);
  const rest = (nl === -1) ? html.slice(after) : html.slice(after, nl);
  if(rest.trim()) after = (nl === -1 ? html.length : nl);   /* drop leftover junk on that line */
  return html.slice(0, f.start) + line + html.slice(after);
}
/* same bake as server.py, but client side → downloads a ready-to-upload index.html */
async function bakeIndexHtml(){
  try{
    const res = await fetch('index.html', { cache: 'no-store' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const html = await res.text();
    const out = bakeInto(html, bakeLine());
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([out], { type: 'text/html;charset=utf-8' }));
    a.download = 'index.html';
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ a.remove(); URL.revokeObjectURL(a.href); }, 5000);
    flash('Downloaded index.html ✓ — ارفعه مكان القديم على الاستضافة');
  }catch(e){ flash('Export failed: ' + e.message, 'err'); }
}
/* is site running from server.py? then /api/save writes straight into index.html */
let LOCAL_SERVER = null;
async function localServer(){
  if(LOCAL_SERVER !== null) return LOCAL_SERVER;
  try{
    const r = await fetch('api/ping', { cache: 'no-store' });
    const j = await r.json();
    LOCAL_SERVER = !!(j && j.ok);
  }catch(e){ LOCAL_SERVER = false; }
  return LOCAL_SERVER;
}
async function saveToLocalServer(payload){
  try{
    const r = await fetch('api/save', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(payload) });
    const j = await r.json().catch(()=>({ ok:false }));
    return !!(j && j.ok);
  }catch(e){ return false; }
}

async function doSave(){
  const btn = document.getElementById('saveBtn'); btn.disabled = true; btn.textContent = 'Saving…';
  try{
    const payload = deepClone(CONTENT); delete payload.__empty;
    const ts = await sbRpc('save_portfolio', { p_password: PASSWORD, p_content: payload });
    lastSaved = ts; CONTENT.__empty = false; markClean();
    /* keep index.html itself in sync when running through server.py */
    if(await localServer()) await saveToLocalServer(payload);
    flash('Saved to Supabase ✓ — live on the site');
    const fr = document.getElementById('previewFrame'); if(fr) fr.contentWindow.location.reload();
  }catch(e){
    if(/WRONG_PASSWORD/.test(e.message)){ flash('Session expired — please log in again', 'err'); doLogout(); }
    else if(await localServer() && await saveToLocalServer(deepClone(CONTENT))){
      flash('Supabase failed (' + e.message + ') — saved into index.html instead ✓', 'err');
    }
    else flash('Save failed: ' + e.message, 'err');
  }
  btn.disabled = false; btn.textContent = '💾 Save to Supabase';
}
async function doReload(){
  if(dirty && !confirm('Discard unsaved changes and reload from the database?')) return;
  try{ await loadFromDb(); renderTab(currentTab); flash('Reloaded from Supabase'); }catch(e){ flash(e.message, 'err'); }
}
function doLogout(){ PASSWORD = ''; sessionStorage.removeItem(SESSION_KEY); location.reload(); }

/* pull the content currently baked inside index.html (first-time migration) */
async function importFromSite(){
  try{
    const html = await (await fetch('index.html', { cache: 'no-store' })).text();
    const f = findBaked(html);
    if(!f) throw new Error('No baked content found in index.html');
    const baked = (new Function('return ' + f.src))();
    /* also grab default avatar + gallery images if the baked content lacks them */
    const av = html.match(/const AVATAR = "(data:[^"]+)"/);
    CONTENT = deepMerge(deepClone(EMPTY_CONTENT), baked);
    if(av && !CONTENT.hero.avatar) CONTENT.hero.avatar = av[1];
    if(!baked.design && baked.settings && baked.settings.accent && CONTENT.design) CONTENT.design.colors.accent = baked.settings.accent;
    CONTENT.__empty = false; markDirty(); renderTab(currentTab);
    flash('Imported from index.html ✓ — now click Save to Supabase');
  }catch(e){ flash('Import failed: ' + e.message, 'err'); }
}

function pickFile(accept, cb){ const inp = document.getElementById('fileInput'); inp.accept = accept || '*/*'; inp.onchange = ()=>{ const f = inp.files[0]; inp.value = ''; if(f) cb(f); }; inp.click(); }
function compressImage(file, maxW, quality){
  return new Promise((res, rej)=>{
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = ()=>{
      const sc = Math.min(1, maxW / img.width); const c = document.createElement('canvas');
      c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL(file.type === 'image/png' && file.size < 300000 ? 'image/png' : 'image/jpeg', quality || .82));
    };
    img.onerror = rej; img.src = url;
  });
}
function readAsDataURL(file){ return new Promise((res, rej)=>{ const r = new FileReader(); r.onload = ()=> res(r.result); r.onerror = rej; r.readAsDataURL(file); }); }
const MAX_ATTACH = 2.5 * 1024 * 1024;
/* base64 → real Blob URL (for opening/downloading the stored CV) */
function cvBlobUrl(){
  const cv = (CONTENT && CONTENT.cv) || {};
  if(!cv.data || cv.data.indexOf('data:') !== 0) return '';
  const m = cv.data.match(/^data:([^;,]+)[^,]*,/);
  try{
    const bin = atob(cv.data.split(',')[1] || ''); const bytes = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    return URL.createObjectURL(new Blob([bytes], { type: m ? m[1] : 'application/octet-stream' }));
  }catch(e){ return ''; }
}

/* =====================================================================
   🌍 LOCATION CHECK — mirrors the provider list in index.html (keep both in sync).
   A null city means one of two things, and this panel says which:
     • the row predates the deploy (no location was ever written), or
     • this browser blocks the IP services (uBlock / Brave / Firefox ETP / VPN).
===================================================================== */
const MM_LOC_SERVICES = [
  ['ipwho.is',     'https://ipwho.is/',                        d => (d && d.success === false) ? null : { city: d.city, country: d.country, code: d.country_code }],
  ['ipapi.co',     'https://ipapi.co/json/',                   d => (d && d.error) ? null : { city: d.city, country: d.country_name, code: d.country_code }],
  ['freeipapi.com','https://free.freeipapi.com/api/v1/json',   d => ({ city: d.cityName, country: d.countryName, code: d.countryCode })],
  ['api.ip.sb',    'https://api.ip.sb/geoip',                  d => ({ city: d.city, country: d.country, code: d.country_code })],
  ['geojs.io',     'https://get.geojs.io/v1/ip/geo.json',      d => ({ city: d.city, country: d.country, code: d.country_code })],
  ['wtfismyip',    'https://wtfismyip.com/json',               d => ({ city: d.YourFuckingCity, country: d.YourFuckingCountry, code: d.YourFuckingCountryCode })],
  ['api.my-ip.io', 'https://api.my-ip.io/v2/ip.json',         d => (!d || d.success === false) ? null : { city: '', country: (d.country || {}).name, code: (d.country || {}).code }]
];
function mmAskService(url, read, ms){
  const p = fetch(url, { cache: 'no-store' })
    .then(r => (r && r.ok) ? r.json() : null)
    .then(d => {
      let loc = null;
      try{ loc = d ? read(d) : null; }catch(e){ loc = null; }
      if(!loc) return { ok: false, err: 'no answer' };
      const txt = [loc.city, loc.country].map(v => (typeof v === 'string' || typeof v === 'number') ? String(v).trim() : '')
        .filter(Boolean).join(', ');
      return txt ? { ok: true, txt: txt } : { ok: false, err: 'no city data' };
    })
    .catch(e => ({ ok: false, err: ((e && e.name) || 'failed') + ' — usually blocked by an ad blocker' }));
  return Promise.race([p, new Promise(res => setTimeout(() => res({ ok: false, err: 'timeout' }), ms || 2500))]);
}
/* coverage: how much of the recent log actually carries a city */
async function loadLocCheck(){
  const cov = document.getElementById('locCoverage'), lat = document.getElementById('locLatest');
  if(!cov) return;
  cov.textContent = '…';
  let rows = [];
  try{
    const r = await fetch(SB_URL + '/rest/v1/portfolio_events?select=event,created_at,meta&order=created_at.desc&limit=300', { headers: sbHeaders(), cache: 'no-store' });
    if(r.ok) rows = await r.json();
  }catch(e){ cov.textContent = 'unavailable (' + e.message + ')'; return; }
  const n = rows.length, withLoc = rows.filter(e => e.meta && e.meta.country).length;   /* country is what the dashboard shows */
  cov.innerHTML = n ? ('<b style="color:' + (withLoc ? 'var(--ok)' : 'var(--warn)') + '">' + withLoc + '</b> of the last ' + n + ' events carry a country' +
                       (withLoc ? '' : ' — none saved yet')) : 'no events in the log yet';
  if(lat) lat.innerHTML = rows[0] ? (esc(mmTimeAgo(rows[0].created_at)) + ' <span style="color:var(--muted)">(' + esc(new Date(rows[0].created_at).toLocaleString()) + ')</span>') : 'nothing recorded yet';
}
async function runLocProbe(){
  const box = document.getElementById('locProbeOut'); if(!box) return;
  box.style.display = 'block';
  box.innerHTML = '<p style="color:var(--muted);font-size:13px">Probing every service from this browser…</p>';
  const list = await Promise.all(MM_LOC_SERVICES.map(svc => mmAskService(svc[1], svc[2]).then(r => Object.assign({ name: svc[0] }, r))));
  const ok = list.filter(r => r.ok).length;
  const useless = list.filter(r => !r.ok && !/TypeError|blocked|timeout|Failed/i.test(r.err || '')).length;
  box.innerHTML =
    '<div style="margin-top:12px;font-size:13px">' +
      (ok ? '<div class="banner" style="background:rgba(52,211,153,.12);border-color:rgba(52,211,153,.35);color:var(--ok);margin-bottom:10px">✅ ' + ok + ' of ' + list.length + ' services answer from this browser (' + esc((list.find(r => r.ok) || {}).txt) + '). The lookup works here — a null in the log means that row was written <b>before</b> the updated index.html went live.</div>'
          : '<div class="banner" style="background:rgba(251,191,36,.1);border-color:rgba(251,191,36,.35);color:var(--warn);margin-bottom:10px">⚠️ No service answers from this browser: an ad blocker / privacy extension (uBlock Origin, Brave Shields, Firefox Enhanced Tracking Protection) or a VPN is eating these requests. Visitors with the same setup get counted as visits but without a city. Turn it off for your own test visit to see the full pipeline.</div>'
          + (useless ? '<p style="color:var(--muted);font-size:12.5px;margin-bottom:10px">' + useless + ' of them did reply, but without usable data — the free tiers are rate limited (about 1,000 lookups/day per service), so try again later.</p>' : '')) +
      list.map(r => '<div style="display:flex;gap:9px;align-items:center;padding:4px 0;border-bottom:1px solid var(--line)">' +
        '<span>' + (r.ok ? '✅' : '❌') + '</span><span style="font-family:var(--mono);font-size:12px;min-width:120px">' + esc(r.name) + '</span>' +
        '<span style="color:' + (r.ok ? 'var(--ok)' : 'var(--muted)') + ';font-size:12.5px">' + esc(r.ok ? r.txt : r.err) + '</span></div>').join('') +
    '</div>';
}

/* fallback: read raw events straight from Supabase so this tab NEVER shows empty */
async function fetchEventsRaw(days){
  const since = new Date(Date.now() - days * 864e5).toISOString();
  const r = await fetch(SB_URL + '/rest/v1/portfolio_events?select=event,visitor_id,meta,path,created_at&created_at=gte.' + encodeURIComponent(since) + '&order=created_at.desc&limit=5000', { headers: sbHeaders(), cache: 'no-store' });
  if(!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function fetchMessagesCount(){
  try{
    const r = await fetch(SB_URL + '/rest/v1/portfolio_messages?select=id', { headers: sbHeaders({ 'Prefer': 'count=exact' }), cache: 'no-store' });
    const cr = r.headers.get('content-range');
    if(cr){ const m = cr.match(/\/(\d+)/); if(m) return parseInt(m[1], 10); }
  }catch(e){}
  return null;
}
/* =====================================================================
   🌍 VISITOR LOCATION (city + country). The live site reads the visitor's IP
   through a free public lookup — never GPS, never a permission prompt — and
   stores only 'city' / 'country' in the event meta. This builds the same shape
   get_analytics() returns, straight from raw event rows, so the panels work
   even on a database that has not run the newest setup.sql yet.
===================================================================== */
function mmFlag(code){
  code = String(code || '').toUpperCase().replace(/[^A-Z]/g, '');
  if(code.length !== 2) return '🏳️';
  return String.fromCodePoint(127397 + code.charCodeAt(0), 127397 + code.charCodeAt(1));
}
function mmTimeAgo(iso){
  const t = Date.parse(iso);
  if(!t) return '—';
  const mins = Math.max(0, Math.round((Date.now() - t) / 60000));
  if(mins < 1) return 'just now';
  if(mins < 60) return mins + ' min ago';
  const hrs = Math.round(mins / 60);
  if(hrs < 24) return hrs + (hrs === 1 ? ' hour ago' : ' hours ago');
  const days = Math.round(hrs / 24);
  return days + (days === 1 ? ' day ago' : ' days ago');
}
function locationFromRows(rows){
  const clean = v => { v = String(v == null ? '' : v).trim(); return v ? v.slice(0, 64) : ''; };
  const cities = {}, countries = {}, visitors = {};
  /* each event that carries a city/country adds itself to the three rollups */
  const bump = (map, key, fresh, e) => {
    const o = map[key] || (map[key] = Object.assign(fresh, { visits: 0, _v: {} }));
    if(e.event === 'view') o.visits++;
    if(e.visitor_id) o._v[e.visitor_id] = 1;
    return o;
  };
  const plain = r => { const out = {}; for(const f in r){ if(f.charAt(0) !== '_') out[f] = r[f]; } return out; };
  const finish = o => Object.keys(o).map(k => {
    const out = plain(o[k]);
    out.visitors = Object.keys(o[k]._v || {}).length;
    return out;
  }).sort((a, b) => (b.visitors - a.visitors) || (b.visits - a.visits));
  (rows || []).forEach(e => {
    const m = e.meta || {};
    const city = clean(m.city), region = clean(m.region), country = clean(m.country), code = clean(m.country_code).toUpperCase();
    const at = String(e.created_at || '');
    if(city) bump(cities, city + '\u00a7' + country, { city: city, country: country, country_code: code }, e);
    if(country){
      const c = bump(countries, country, { country: country, country_code: code, cities: 0 }, e);
      if(city && !c._seen){ c._seen = {}; }
      if(city && c._seen && !c._seen[city]){ c._seen[city] = 1; c.cities++; }
    }
    /* per visitor: the newest known location + their own visit/event counts */
    const vid = e.visitor_id || '(unknown)';
    const v = visitors[vid] || (visitors[vid] = { visitor_id: vid, visits: 0, events: 0, city: '', region: '',
      country: '', country_code: '', source: '', first_visit: '', last_seen: '', _src: {} });
    v.events++;
    if(!v.first_visit || at < v.first_visit) v.first_visit = at;
    if(at > v.last_seen){
      v.last_seen = at;
      if(city || country){ v.city = city; v.region = region; v.country = country; v.country_code = code; }
    }
    if(e.event === 'view'){
      v.visits++;
      const src = clean(m.source) || 'direct';
      v._src[src] = (v._src[src] || 0) + 1;
    }
  });
  /* the source shown next to a visitor is the one they used most */
  const people = Object.keys(visitors).map(k => {
    const r = visitors[k], out = plain(r);
    let top = '', best = 0;
    for(const src in r._src){ if(r._src[src] > best){ best = r._src[src]; top = src; } }
    if(top) out.source = top;
    return out;
  }).sort((a, b) => String(b.last_seen).localeCompare(String(a.last_seen))).slice(0, 40);
  return { cities: finish(cities), countries: finish(countries), visitors: people };
}

/* compute the same shape as get_analytics() from raw rows */
function analyticsFromRows(rows, days){
  const t = { view:0, unique_visitors:0, project_view:0, cv_download:0, github_click:0, linkedin_click:0, contact_submit:0 };
  const visitors = new Set(), perDay = {}, proj = {}, src = {};
  for(let i = 0; i <= days; i++){ perDay[new Date(Date.now() - (days - i) * 864e5).toISOString().slice(0,10)] = { v: new Set(), n: 0 }; } /* inclusive ends = 31 rows, same as SQL */
  /* full, recognizable place names - identical mapping to pb_event_source() in SQL */
  const canon = s => {
    s = String(s || '').toLowerCase().trim().replace(/^www\./, '');
    if(!s || s === '(direct)' || s === 'none') return 'direct';
    if(s === 'ig' || s === 'insta' || s.includes('instagram')) return 'instagram';
    if(s === 'fb' || s.includes('facebook') || s.includes('fb.me')) return 'facebook';
    if(s === 'in' || s.includes('linkedin') || s.includes('lnkd.in')) return 'linkedin';
    if(s === 'x' || s === 'x.com' || s === 't.co' || s.includes('twitter')) return 'twitter';
    if(s === 'wa' || s.includes('whatsapp')) return 'whatsapp';
    if(s === 'tg' || s.includes('t.me') || s.includes('telegram')) return 'telegram';
    if(s === 'yt' || s === 'youtu.be' || s.includes('youtube')) return 'youtube';
    if(s.includes('tiktok')) return 'tiktok';
    if(s.includes('reddit') || s === 'redd.it') return 'reddit';
    if(s.includes('github')) return 'github';
    if(s.includes('gmail') || s === 'email' || s === 'newsletter' || s === 'mail') return 'email';
    return s;
  };
  const srcOf = e => canon((e.meta && e.meta.source) || ((e.path || '').match(/utm_source=([^&]+)/) || [])[1] || (/fbclid=/.test(e.path || '') ? 'facebook' : 'direct'));
  (rows || []).forEach(e => {
    const k = String(e.created_at || '').slice(0, 10);
    if(!(k in perDay)) return;
    perDay[k].n++;
    if(e.visitor_id) perDay[k].v.add(e.visitor_id);
    if(e.event === 'view'){
      t.view++; visitors.add(e.visitor_id || 'anon');
      const s = String(srcOf(e) || 'direct'); src[s] = (src[s] || 0) + 1;
    }
    else if(e.event === 'project_view'){ t.project_view++; const p = (e.meta && (e.meta.project || e.meta.title)) || 'unknown'; proj[p] = (proj[p] || 0) + 1; }
    else if(e.event === 'cv_download' || e.event === 'download_cv') t.cv_download++;
    else if(e.event === 'github_click') t.github_click++;
    else if(e.event === 'linkedin_click') t.linkedin_click++;
    else if(e.event === 'contact_submit' || e.event === 'generate_lead') t.contact_submit++;
  });
  t.unique_visitors = visitors.size;
  const daily = Object.keys(perDay).sort().map(d => ({ date: d, visitors: perDay[d].v.size, events: perDay[d].n }));
  let top = null; for(const p in proj){ if(!top || proj[p] > top.views) top = { id: p, views: proj[p] }; }
  const sources = Object.keys(src).map(s => ({ source: s, visits: src[s] })).sort((a, b) => b.visits - a.visits).slice(0, 6);
  const loc = locationFromRows(rows);       /* city + country come from the same rows */
  return { days: days, totals: t, daily: daily, top_project: top, sources: sources,
           cities: loc.cities, countries: loc.countries, visitors: loc.visitors };
}

async function loadAnalytics(){
  const box = document.getElementById('analyticsBody'); if(!box) return;
  box.innerHTML = '<p style="color:var(--muted)">Loading…</p>';
  let d, mode = 'rpc';
  try{ d = await sbRpc('get_analytics', { p_days: 30 }); }
  catch(e){
    try{ d = analyticsFromRows(await fetchEventsRaw(30), 30); mode = 'raw'; }
    catch(e2){
      box.innerHTML = '<div class="banner">⚠️ ' + esc(e.message) + '<br>Could not read raw events either: ' + esc(e2.message) +
        '<br>Run the new <code>setup.sql</code> in Supabase → SQL Editor, then press Refresh.</div>';
      return;
    }
  }
  /* an older get_analytics() has no location keys: roll them up from the raw
     events instead, so the country panel never depends on the SQL being re-run */
  if(!Array.isArray(d.countries) || !Array.isArray(d.visitors)){
    try{
      const loc = locationFromRows(await fetchEventsRaw(30));
      if(!Array.isArray(d.countries)) d.countries = loc.countries;
      if(!Array.isArray(d.visitors)) d.visitors = loc.visitors;
    }catch(e){}
  }
  const t = d.totals || {};
  const cards = [
    ['👀 Visits', t.view],
    ['🧑 Unique visitors', t.unique_visitors],
    ['🚀 Project opens', t.project_view],
    ['📄 CV downloads', t.cv_download],
    ['🐙 GitHub clicks', t.github_click],
    ['💼 LinkedIn clicks', t.linkedin_click],
    ['📝 Form submits', t.contact_submit]
  ];
  /* 🌍 where visitors are: city + country resolved from the IP (never GPS) */
  const cts = Array.isArray(d.countries) ? d.countries : [];
  if(cts.length) cards.push(['🌍 Countries', cts.length]);
  const msgCount = (d.messages !== undefined && d.messages !== null) ? d.messages : await fetchMessagesCount();
  if(msgCount !== null) cards.push(['📨 Messages', msgCount]);

  const daily = d.daily || [];
  const top = d.top_project;
  const maxV = Math.max(1, daily.reduce((m,x)=> Math.max(m, x.visitors||0), 0));
  const bars = daily.map((x,i)=>{
    const v = x.visitors||0, h = Math.round(100 * v / maxV);
    return '<div class="chart-col" title="'+esc(x.date)+' — '+v+' visitor(s), '+(x.events||0)+' event(s)">'+
      '<div class="chart-bar" style="height:'+Math.max(2,h)+'%"></div>'+
      '<span class="chart-lbl">'+(i % 5 === 0 || i === daily.length-1 ? String(x.date).slice(5) : '')+'</span></div>';
  }).join('');
  const totVis = daily.reduce((s,x)=> s+(x.visitors||0),0), totEv = daily.reduce((s,x)=> s+(x.events||0),0);

  /* traffic sources */
  const srcs = d.sources || [];
  const maxSrc = Math.max(1, ...srcs.map(s => s.visits || 0));
  const srcHtml = srcs.length ? srcs.map(s =>
    '<div style="display:flex;align-items:center;gap:10px;margin:7px 0">'+
      '<span style="width:120px;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+esc(s.source)+'">'+esc(s.source)+'</span>'+
      '<span style="flex:1;height:8px;border-radius:4px;background:var(--panel2);overflow:hidden;display:block"><span style="display:block;height:100%;width:'+Math.round(100*(s.visits||0)/maxSrc)+'%;background:linear-gradient(90deg,var(--acc),transparent)"></span></span>'+
      '<b style="min-width:28px;text-align:right">'+(s.visits||0)+'</b>'+
    '</div>').join('')
    : '<p style="color:var(--muted);font-size:13px">No sources recorded yet — new visits are tagged automatically (instagram / facebook / direct…).</p>';

  /* 🌍 where visitors are: shown at COUNTRY level on purpose. The city an IP
     resolves to is the city of the provider's gateway, not where the person is
     standing (all of Upper Egypt reads as Cairo on Egyptian lines), so the city
     is kept in meta but deliberately not displayed. No GPS, no location
     permission, no coordinates - country from the IP is ~99% reliable. */
  const ppl = Array.isArray(d.visitors) ? d.visitors : [];
  const maxLoc = Math.max(1, ...cts.map(c => c.visitors || 0));
  const locHtml = cts.length ? cts.map(c =>
    '<div style="display:flex;align-items:center;gap:10px;margin:7px 0">'+
      '<span style="width:22px;font-size:15px;line-height:1">'+mmFlag(c.country_code)+'</span>'+
      '<span style="width:150px;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+esc(c.country||'')+'">'+esc(c.country || 'Unknown country')+'</span>'+
      '<span style="flex:1;height:8px;border-radius:4px;background:var(--panel2);overflow:hidden;display:block"><span style="display:block;height:100%;width:'+Math.round(100*(c.visitors||0)/maxLoc)+'%;background:linear-gradient(90deg,var(--acc),transparent)"></span></span>'+
      '<b style="min-width:26px;text-align:right">'+(c.visitors||0)+'</b>'+
      '<span style="min-width:70px;text-align:right;font-size:11.5px;color:var(--muted)" title="'+(c.visits||0)+' visit(s) in the last 30 days">'+(c.visits||0)+(c.visits === 1 ? ' visit' : ' visits')+'</span>'+
    '</div>').join('')
    : '<p style="color:var(--muted);font-size:13px">No country saved yet. Two normal reasons: rows written <b>before</b> the updated index.html went live have no location (the IP is never stored, so they can never be filled retroactively), or a visitor\'s browser blocks the IP services (ad blocker / VPN). Use the <b>🔎 Test the location lookup</b> button above to see which one it is.</p>';
  const when = s => { const t = Date.parse(s); return t ? new Date(t).toLocaleString() : ''; };
  const visitorHtml = ppl.map(v => {
    const tip = (v.first_visit ? 'First visit: ' + when(v.first_visit) : '') + (v.last_seen ? (v.first_visit ? '  ·  ' : '') + 'Last seen: ' + when(v.last_seen) : '');
    return '<div class="vrow">'+
      '<span class="vid">'+esc(v.visitor_id || '—')+'</span>'+
      '<span class="loc">'+(v.country_code ? mmFlag(v.country_code)+' ' : '')+esc(v.country || 'no country saved')+'</span>'+
      '<span class="sub">from '+esc(v.source || 'direct')+'</span>'+
      '<span class="sub">'+(v.visits||0)+' visit'+((v.visits||0) === 1 ? '' : 's')+(v.events ? ' · '+(v.events||0)+' event'+((v.events||0) === 1 ? '' : 's') : '')+'</span>'+
      '<time title="'+esc(tip)+'">'+esc(mmTimeAgo(v.last_seen))+'</time>'+
    '</div>';
  }).join('');

  const emptyAll = totEv === 0 && !srcs.length;
  box.innerHTML =
    (mode === 'raw' ? '<div class="banner" style="margin-bottom:12px">ℹ️ Computed from raw events (the <code>get_analytics</code> RPC is unavailable — run the new <code>setup.sql</code> to enable server-side stats &amp; the messages count here).</div>' : '')+
    (emptyAll
      ? '<p style="color:var(--muted);font-size:13.5px;padding:18px 0">No visits recorded in the last 30 days.<br>Open your <b>live site</b> (this dashboard preview is not counted) and press ↻ Refresh.</p>'
      :
    '<div class="row3" style="margin-bottom:14px">'+cards.map(c=>'<div class="stat"><span class="l">'+c[0]+'</span><span class="n">'+(c[1]===undefined||c[1]===null?'—':c[1])+'</span></div>').join('')+'</div>'+
    '<div class="card" style="margin-bottom:14px"><h3>Where visitors came from<span class="line"></span></h3>'+srcHtml+'</div>'+
    '<div class="card" style="margin-bottom:14px"><h3>🌍 Where visitors are · by country<span class="line"></span></h3>'+locHtml+
      '<p style="color:var(--muted);font-size:11.5px;margin-top:10px">Country resolved from the visitor\'s <b>IP address</b> — reliable (~99%). Cities are deliberately <b>not</b> shown: an IP is registered to the provider\'s gateway city, so one country often resolves to its capital for everyone, and a VPN reads as the VPN city. No GPS and no precise-location permission are used, and no coordinates or IP addresses are stored. <b>🔎 Test the location lookup</b> above shows the provider + ASN behind any reading.</p>'+'</div>'+
    (visitorHtml ? '<div class="card" style="margin-bottom:14px"><h3>Visitors<span class="line"></span></h3>'+visitorHtml+
      '<p style="color:var(--muted);font-size:11.5px;margin-top:4px">Latest '+(ppl.length)+' visitor'+(ppl.length === 1 ? '' : 's')+' — id, the country their IP belongs to, where they came from, and when.</p></div>' : '')+
    '<div style="background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px;font-size:13.5px">'+
      '🏆 <b>Most opened project:</b> ' + (top ? esc(top.id) + ' <span style="color:var(--muted);font-size:12.5px">(' + top.views + ' opens)</span>' : '<span style="color:var(--muted)">no project opens yet — click a project card on your site to test it</span>') +
    '</div>'+
    '<div class="row3" style="margin-bottom:18px">'+
      '<div class="stat"><span class="l">Visitors (last ' + (d.days||30) + ' days)</span><span class="n">' + totVis + '</span></div>'+
      '<div class="stat"><span class="l">Total events (last ' + (d.days||30) + ' days)</span><span class="n">' + totEv + '</span></div>'+
    '</div>'+
    '<h3 style="font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--acc);margin-bottom:4px">Visitors over time <span style="color:var(--muted);font-size:11.5px;text-transform:none;letter-spacing:0">(last ' + (d.days||30) + ' days, per day)</span></h3>'+
    (daily.length && totVis > 0 ? '<div class="chart">' + bars + '</div>' : '<p style="color:var(--muted);font-size:13px;padding:14px 0">No visits with a known visitor yet — the chart fills in as people (or you, on the live site) visit.</p>'));
}

async function loadMessages(){
  const box = document.getElementById('messagesBody'); if(!box) return;
  box.innerHTML = '<p style="color:var(--muted)">Loading…</p>';
  let rows;
  try{
    const r = await fetch(SB_URL + '/rest/v1/portfolio_messages?select=id,name,email,message,status,created_at&order=created_at.desc&limit=200', { headers: sbHeaders(), cache: 'no-store' });
    if(!r.ok){
      let msg = 'HTTP ' + r.status;
      try{ const j = await r.json(); if(j && j.message) msg = j.message; }catch(e){}
      throw new Error(msg + ' — run the “ADDITION (v2)” section of setup.sql in Supabase → SQL Editor first.');
    }
    rows = await r.json();
  }catch(e){
    box.innerHTML = '<div class="banner">⚠️ ' + esc(e.message) + '</div>';
    return;
  }
  const counts = { all: rows.length, new: 0, read: 0, replied: 0 };
  rows.forEach(m => { if(counts[m.status] !== undefined) counts[m.status]++; });
  const shown = msgFilter === 'all' ? rows : rows.filter(m => m.status === msgFilter);
  box.innerHTML =
    '<div class="chip-row" style="margin-bottom:14px">'+
      ['all','new','read','replied'].map(f=>
        '<button class="mini" data-act="msg-filter" data-filter="'+f+'"'+(msgFilter===f ? ' style="border-color:var(--acc);color:var(--acc)"' : '')+'>'+
        f.charAt(0).toUpperCase()+f.slice(1)+' ('+counts[f]+')</button>').join('')+
    '</div>'+
    (shown.length ? shown.map(m=>{
      const unread = m.status === 'new';
      return '<div class="msg'+(unread?' unread':'')+'">'+
        '<div class="msg-head"><b>'+esc(m.name)+'</b><span class="em">&lt;'+esc(m.email)+'&gt;</span>'+
          '<span class="badge '+esc(m.status)+'">'+esc(m.status)+'</span>'+
          '<time>'+new Date(m.created_at).toLocaleString()+'</time></div>'+
        '<p class="msg-text"'+(unread ? ' data-act="msg-open" data-id="'+m.id+'" style="cursor:pointer" title="Click to mark as read"' : '')+'>'+esc(m.message)+'</p>'+
        '<div class="msg-actions">'+
          '<a class="mini" style="text-decoration:none" href="mailto:'+esc(m.email)+'">✉️ Reply by email</a>'+
          (m.status !== 'read' ? '<button class="mini" data-act="msg-status" data-id="'+m.id+'" data-status="read">✓ Mark read</button>' : '')+
          (m.status !== 'replied' ? '<button class="mini" data-act="msg-status" data-id="'+m.id+'" data-status="replied">↩ Mark replied</button>' : '')+
          (m.status !== 'new' ? '<button class="mini" data-act="msg-status" data-id="'+m.id+'" data-status="new">↺ Back to new</button>' : '')+
        '</div></div>';
    }).join('')
    : '<p style="color:var(--muted);font-size:13px">No messages '+(msgFilter==='all' ? 'yet — once your live site\'s contact form posts here they will appear in this list.' : 'with this status.')+'</p>');
}

function renderTab(tab){
  currentTab = tab;
  document.querySelectorAll('#tabs .tab').forEach(b=> b.classList.toggle('active', b.dataset.tab === tab));
  const mainEl = document.getElementById('main');
  try{ mainEl.innerHTML = R[tab] ? R[tab]() : ''; }
  catch(err){
    /* one broken renderer must not leave a blank, dead-looking tab with no explanation */
    console.error('renderTab(' + tab + ') failed:', err);
    mainEl.innerHTML = '<h2>'+esc(tab)+'</h2><div class="banner">⚠️ This tab could not be rendered: '+esc(err && err.message)+' — التفاصيل في الـ Console.</div>';
    return;
  }
  window.scrollTo(0,0);
  if(tab === 'preview'){ const fr = document.getElementById('previewFrame'); if(fr) fr.onload = pushPreview; }
  if(tab === 'analytics'){ loadAnalytics(); loadLocCheck(); }
  if(tab === 'messages') loadMessages();
}
function pushPreview(){ const fr = document.getElementById('previewFrame'); if(fr && fr.contentWindow){ const c = deepClone(CONTENT); delete c.__empty; fr.contentWindow.postMessage({type:'mm-preview', content:c}, '*'); } }

/* =====================================================================
   EVENTS
===================================================================== */
document.getElementById('tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if(b) renderTab(b.dataset.tab); });
document.querySelector('header').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if(!b) return;
  if(b.dataset.act === 'save') doSave(); else if(b.dataset.act === 'reload') doReload(); else if(b.dataset.act === 'logout'){ if(!dirty || confirm('Unsaved changes will be lost. Logout?')) doLogout(); }
});
document.addEventListener('keydown', e => { if((e.ctrlKey||e.metaKey) && e.key.toLowerCase() === 's'){ e.preventDefault(); doSave(); } });

const main = document.getElementById('main');
main.addEventListener('input', e => {
  const t = e.target;
  if(t.dataset.path){ let v = t.value; if(t.tagName === 'SELECT' && /^\d+$/.test(v)) v = +v; setPath(CONTENT, t.dataset.path, v); markDirty(); }
  else if(t.dataset.list){ setPath(CONTENT, t.dataset.list, t.value.split('\n').map(s=>s.trim()).filter(Boolean)); markDirty(); }
});
main.addEventListener('change', e => {
  const t = e.target;
  if(t.dataset.bool){ setPath(CONTENT, t.dataset.bool, t.checked); markDirty(); }
});
main.addEventListener('keydown', e => {
  if(e.key === 'Enter' && e.target.dataset.chipInput){ e.preventDefault(); addChip(e.target.dataset.chipInput, e.target.value); }
});
function addChip(path, val){ val = (val||'').trim(); if(!val) return; arr(path).push(val); markDirty(); renderTab(currentTab); setTimeout(()=>{ const i = main.querySelector('[data-chip-input="'+path+'"]'); if(i) i.focus(); }, 0); }

main.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if(!b) return;
  const act = b.dataset.act, path = b.dataset.path, i = +b.dataset.i;
  if(act === 'add'){ arr(path).push(JSON.parse(b.dataset.tpl)); markDirty(); renderTab(currentTab); return; }
  if(act === 'del'){ if(b.closest('.att') || b.closest('.thumb') || confirm('Delete this item?')){ arr(path).splice(i,1); markDirty(); renderTab(currentTab); } return; }
  if(act === 'move'){ const a = arr(path), j = i + (+b.dataset.d); if(j<0||j>=a.length) return; [a[i],a[j]] = [a[j],a[i]]; markDirty(); renderTab(currentTab); return; }
  if(act === 'chip-add'){ addChip(path, main.querySelector('[data-chip-input="'+path+'"]').value); return; }
  if(act === 'chip-del'){ arr(path).splice(i,1); markDirty(); renderTab(currentTab); return; }
  if(act === 'photo'){ pickFile('image/*', async f => { CONTENT.hero.avatar = await compressImage(f, 600, .85); markDirty(); renderTab(currentTab); }); return; }
  if(act === 'photo-del'){ delete CONTENT.hero.avatar; markDirty(); renderTab(currentTab); return; }
  if(act === 'cv-upload'){ pickFile(CV_ACCEPT, async f => {
      if(f.size > MAX_ATTACH){ flash('CV too big (max 2.5 MB). Compress it, or host it on Google Drive and add a link instead.', 'err'); return; }
      try{
        const data = await readAsDataURL(f);
        const prev = getPath(CONTENT, 'cv') || {};
        setPath(CONTENT, 'cv', { name: f.name, data, visible: prev.visible !== false });
        markDirty(); renderTab(currentTab); flash('CV added ✓ — now click Save to Supabase');
      }catch(err){ flash('Could not read the file: ' + err.message, 'err'); }
    }); return; }
  if(act === 'cv-del'){ if(!confirm('Remove the CV?')) return; setPath(CONTENT, 'cv', { name:'', data:'', visible:true }); markDirty(); renderTab(currentTab); return; }
  if(act === 'cv-download'){ const u = cvBlobUrl(); if(!u){ flash('No CV uploaded', 'err'); return; }
      const a = document.createElement('a'); a.href = u; a.download = (CONTENT.cv && CONTENT.cv.name) || 'CV';
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=> URL.revokeObjectURL(u), 30000); return; }
  if(act === 'cv-preview'){ const u = cvBlobUrl(); if(!u){ flash('No CV uploaded', 'err'); return; } window.open(u, '_blank'); return; }
  if(act === 'img-add'){ pickFile('image/*', async f => { arr(path).push(await compressImage(f, 1200, .8)); markDirty(); renderTab(currentTab); }); return; }
  if(act === 'img-set'){ pickFile('image/*', async f => { setPath(CONTENT, path, await compressImage(f, 1400, .8)); markDirty(); renderTab(currentTab); }); return; }
  if(act === 'att-file'){ pickFile('*/*', async f => {
      if(f.size > MAX_ATTACH){ flash('File too big (max 2.5 MB). Upload it to Google Drive / YouTube and add the link instead.', 'err'); return; }
      const data = /^image\//.test(f.type) ? await compressImage(f, 1400, .8) : await readAsDataURL(f);
      arr(path).push({ name: f.name, data }); markDirty(); renderTab(currentTab); }); return; }
  if(act === 'att-link'){ const inp = main.querySelector('[data-att-url="'+path+'"]'); const u = (inp.value||'').trim(); if(!/^https?:\/\//.test(u)){ flash('Enter a valid link starting with https://', 'err'); return; }
      arr(path).push({ name: u.replace(/^https?:\/\//,'').slice(0,60), url: u }); markDirty(); renderTab(currentTab); return; }
  if(act === 'import'){ if(!CONTENT.__empty && !confirm('This replaces your current edits with the content baked in index.html. Continue?')) return; importFromSite(); return; }
  if(act === 'export'){ exportJson(); return; }
  if(act === 'bake'){ bakeIndexHtml(); return; }
  if(act === 'restore'){ pickFile('application/json', async f => { try{ const j = JSON.parse(await f.text()); CONTENT = deepMerge(deepClone(EMPTY_CONTENT), j); if(!j.design && j.settings && j.settings.accent && CONTENT.design) CONTENT.design.colors.accent = j.settings.accent; CONTENT.__empty = false; markDirty(); renderTab(currentTab); flash('Restored — click Save'); }catch(err){ flash('Invalid JSON', 'err'); } }); return; }
  if(act === 'change-pass'){
    const a = document.getElementById('newPass').value, c = document.getElementById('newPass2').value;
    if(a.length < 4){ flash('Min 4 characters', 'err'); return; } if(a !== c){ flash('Passwords do not match', 'err'); return; }
    try{ await sbRpc('change_password', { p_old: PASSWORD, p_new: a }); PASSWORD = a; sessionStorage.setItem(SESSION_KEY, a); flash('Password changed ✓'); document.getElementById('newPass').value = document.getElementById('newPass2').value = ''; }
    catch(err){ flash('Failed: ' + err.message, 'err'); } return; }
  if(act === 'pv-desktop' || act === 'pv-mobile'){ document.getElementById('previewFrame').classList.toggle('mobile', act === 'pv-mobile'); return; }
  if(act === 'design-accent'){ setPath(CONTENT, 'design.colors.accent', b.dataset.v); markDirty(); renderTab(currentTab); return; }
  if(act === 'design-reset'){ if(!confirm('Reset all design settings (theme, colors, fonts, animations, layout…) to defaults?')) return; setPath(CONTENT, 'design', deepClone(EMPTY_CONTENT.design)); markDirty(); renderTab(currentTab); return; }
  if(act === 'pv-refresh'){ const fr = document.getElementById('previewFrame'); fr.src = 'index.html?preview=' + Date.now(); return; }
  if(act === 'analytics-refresh'){ loadAnalytics(); loadLocCheck(); return; }
  if(act === 'loc-probe'){ runLocProbe(); return; }
  if(act === 'msg-filter'){ msgFilter = b.dataset.filter; loadMessages(); return; }
  if(act === 'msg-open'){
    const id = +b.dataset.id;
    try{ await sbRpc('update_message', { p_password: PASSWORD, p_id: id, p_status: 'read' }); loadMessages(); }
    catch(e){ if(/WRONG_PASSWORD/.test(e.message)){ flash('Session expired — please log in again', 'err'); doLogout(); } }
    return; }
  if(act === 'msg-status'){
    const id = +b.dataset.id, st = b.dataset.status;
    b.disabled = true;
    try{
      const ok = await sbRpc('update_message', { p_password: PASSWORD, p_id: id, p_status: st });
      if(ok === true) loadMessages(); else flash('Message not found', 'err');
    }catch(e){
      b.disabled = false;
      if(/WRONG_PASSWORD/.test(e.message)){ flash('Session expired — please log in again', 'err'); doLogout(); }
      else flash('Failed: ' + e.message, 'err');
    }
    return; }
});
</script>
</body>
</html>
