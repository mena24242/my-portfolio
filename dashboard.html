<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Dashboard — Mena Medhat Portfolio</title>
<script src="supabase-config.js"></script>
<style>
:root{--bg:#0b0f1a;--panel:#111827;--panel2:#0f172a;--line:rgba(148,163,184,.14);--text:#e5e7eb;--muted:#94a3b8;--acc:#38bdf8;--acc2:#22d3ee;--ok:#34d399;--err:#fb7185;--warn:#fbbf24;--sans:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
a{color:var(--acc)}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:14px;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;outline:none;transition:border .15s}
input:focus,textarea:focus,select:focus{border-color:var(--acc)}
textarea{min-height:90px;resize:vertical}
textarea.code{font-family:var(--mono);font-size:12.5px;min-height:160px;white-space:pre}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600;letter-spacing:.02em}
.f{margin-bottom:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.row,.row3{grid-template-columns:1fr}}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
/* login */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 600px at 20% -10%,rgba(56,189,248,.12),transparent),var(--bg);z-index:50}
.login-card{width:min(420px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:32px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.login-card h1{font-size:22px;margin-bottom:4px}
.login-card p{color:var(--muted);font-size:13px;margin-bottom:22px}
.status{margin-top:12px;font-size:12.5px;padding:10px 12px;border-radius:10px;background:rgba(148,163,184,.08);color:var(--muted);word-break:break-word}
.status.err{background:rgba(251,113,133,.12);color:var(--err)}
.status.ok{background:rgba(52,211,153,.12);color:var(--ok)}
/* app */
#app{display:none;min-height:100%}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 18px;background:rgba(11,15,26,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header .brand{font-weight:800;letter-spacing:.02em}
header .brand small{display:block;font-weight:500;color:var(--muted);font-size:11px}
header .sp{flex:1}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:6px}
.dot.dirty{background:var(--warn)}
.dot.off{background:var(--err)}
#syncLabel{font-size:12px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:9px 14px;border-radius:10px;font-weight:600;font-size:13px;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--acc);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#04121c;border:none}
.btn.danger{color:var(--err)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.mini{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:6px 11px;border-radius:8px;font-size:12px;font-weight:600}
.mini:hover{border-color:var(--acc)}
.mini.danger{color:var(--err)}
.layout{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 58px)}
@media(max-width:900px){.layout{grid-template-columns:1fr}#tabs{flex-direction:row;overflow-x:auto;position:static!important;height:auto!important;border-right:none!important;border-bottom:1px solid var(--line)}#tabs .tab{white-space:nowrap}}
#tabs{display:flex;flex-direction:column;gap:2px;padding:14px 10px;border-right:1px solid var(--line);position:sticky;top:58px;height:calc(100vh - 58px);overflow-y:auto}
.tab{display:flex;align-items:center;gap:10px;text-align:left;background:none;border:none;color:var(--muted);padding:10px 12px;border-radius:10px;font-weight:600;font-size:13px}
.tab:hover{background:rgba(148,163,184,.07);color:var(--text)}
.tab.active{background:rgba(56,189,248,.12);color:var(--acc)}
.tab .em{font-size:16px;width:22px;text-align:center}
main{padding:26px 28px 120px;max-width:1080px}
main h2{font-size:22px;margin-bottom:6px}
.desc{color:var(--muted);font-size:13px;margin-bottom:22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px}
.card h3{display:flex;align-items:center;gap:12px;font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--acc);margin-bottom:16px}
.card h3 .line{flex:1;height:1px;background:var(--line)}
.item{border:1px dashed var(--line);border-radius:14px;padding:16px;margin-bottom:14px;background:rgba(15,23,42,.5)}
.it-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.it-head b{flex:1;font-size:13px;color:var(--muted)}
.chip-row{display:flex;flex-wrap:wrap;gap:8px}
.chip-edit{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);padding:5px 6px 5px 10px;border-radius:999px;font-size:13px}
.chip-edit button{background:none;border:none;color:var(--err);font-size:15px;line-height:1}
.switch-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;color:var(--text);font-weight:500}
.switch-row:last-child{border-bottom:none}
.switch-row input{width:18px;height:18px;accent-color:var(--acc)}
.avatar{width:110px;height:110px;border-radius:50%;object-fit:cover;border:3px solid var(--acc);background:var(--panel2)}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumb{position:relative;width:88px;height:66px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.65);color:#fff;border:none;border-radius:6px;font-size:11px;padding:2px 6px}
.att{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px;font-size:13px}
.att span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att small{color:var(--muted)}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--panel);border:1px solid var(--line);color:var(--text);padding:12px 18px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:92vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{border-color:var(--err);color:var(--err)}
.preview-frame{width:100%;height:78vh;border:1px solid var(--line);border-radius:14px;background:#000}
.preview-frame.mobile{width:390px;max-width:100%;margin:0 auto;display:block}
.banner{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.35);color:var(--warn);padding:12px 14px;border-radius:12px;font-size:13px;margin-bottom:18px}
code{font-family:var(--mono);background:rgba(148,163,184,.12);padding:2px 6px;border-radius:6px;font-size:12px}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);padding:1px 5px;border-radius:5px;color:var(--muted)}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login">
  <form class="login-card" id="loginForm">
    <h1>🔐 Portfolio Dashboard</h1>
    <p>Everything you save here goes straight to Supabase and appears on the live site.</p>
    <div class="f"><label>Password</label><input id="pw" type="password" placeholder="Dashboard password" autocomplete="current-password" autofocus></div>
    <button class="btn primary" type="submit" style="width:100%;justify-content:center" id="loginBtn">Sign in</button>
    <div class="status" id="loginStatus">Checking connection…</div>
  </form>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <header>
    <div class="brand">Mena Medhat <small>Portfolio dashboard · Supabase</small></div>
    <div class="sp"></div>
    <span id="syncLabel"><span class="dot" id="dot"></span>Synced</span>
    <button class="btn" data-act="reload" title="Discard local edits and reload from the database">↻ Reload</button>
    <button class="btn primary" data-act="save" id="saveBtn">💾 Save to Supabase</button>
    <button class="btn" data-act="logout">Logout</button>
  </header>

  <div class="layout">
    <aside id="tabs"></aside>
    <main id="main"></main>
  </div>
</div>

<div id="toast"></div>
<input type="file" id="fileInput" style="display:none">

<script>
/* =====================================================================
   SUPABASE CLIENT (REST + RPC, no SDK needed)
===================================================================== */
const SB_URL = (window.SUPABASE_URL || '').replace(/\/$/, '');
const SB_KEY = window.SUPABASE_ANON_KEY || '';
const SESSION_KEY = 'mm_dash_session';   /* password kept in sessionStorage only for this tab */

function sbHeaders(extra){
  return Object.assign({ apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' }, extra || {});
}
async function sbRpc(fn, args){
  const r = await fetch(SB_URL + '/rest/v1/rpc/' + fn, { method: 'POST', headers: sbHeaders(), body: JSON.stringify(args || {}) });
  const txt = await r.text();
  let data = null; try{ data = txt ? JSON.parse(txt) : null; }catch(e){ data = txt; }
  if(!r.ok){
    const msg = (data && (data.message || data.hint || data.details)) || ('HTTP ' + r.status);
    throw new Error(msg);
  }
  return data;
}
async function sbLoad(){
  const r = await fetch(SB_URL + '/rest/v1/portfolio?id=eq.main&select=content,updated_at', { headers: sbHeaders(), cache: 'no-store' });
  if(!r.ok) throw new Error('HTTP ' + r.status + ' — did you run setup.sql?');
  const rows = await r.json();
  return rows && rows[0] ? rows[0] : { content: {}, updated_at: null };
}

/* =====================================================================
   STATE
===================================================================== */
let CONTENT = null;          /* the full portfolio JSON */
let PASSWORD = '';
let dirty = false;
let currentTab = 'hero';
let lastSaved = null;

const EMPTY_CONTENT = {
  brand:{name:'',tag:''},
  hero:{pill:'',hello:"Hi, I'm",name:'',typePrefix:'',typeWords:[],lead:'',tags:[],stats:[]},
  about:{eyebrow:'About Me',title:'',sub:'',cards:[]},
  education:{eyebrow:'Education',title:'Academic Background',items:[]},
  experience:{eyebrow:'Experience',title:"Where I've Applied It",items:[]},
  services:{eyebrow:'Services',title:'What I Do',sub:'',items:[]},
  skills:{eyebrow:'Skills',title:'Toolbox & Expertise',sub:'',groups:[]},
  projects:{eyebrow:'Projects',title:'Selected Work',sub:'',items:[]},
  certifications:{eyebrow:'Certifications & Awards',title:'Credentials',sub:'',certs:[]},
  testimonials:{eyebrow:'Testimonials',title:'What People Say',sub:'',items:[]},
  contact:{eyebrow:'Contact',title:"Let's Build Something",sub:'',email:'',phone:'',phoneDisplay:'',linkedin:'',linkedinUrl:'',github:'',githubUrl:'',location:''},
  footer:{line1:'',line2:''},
  settings:{accent:'cyan',sections:{about:true,education:true,experience:true,services:true,skills:true,projects:true,certifications:true,testimonials:false,contact:true}},
  custom:{sections:[]}
};
function deepClone(x){ return JSON.parse(JSON.stringify(x)); }
function deepMerge(base, over){
  const o = Array.isArray(base) ? [] : {};
  for(const k in base){
    if(over && over[k] !== undefined && typeof over[k] === 'object' && over[k] !== null && !Array.isArray(over[k]) && typeof base[k] === 'object' && base[k] !== null && !Array.isArray(base[k])) o[k] = deepMerge(base[k], over[k]);
    else if(over && over[k] !== undefined) o[k] = deepClone(over[k]);
    else o[k] = deepClone(base[k]);
  }
  if(over) for(const k in over) if(base[k] === undefined) o[k] = deepClone(over[k]);
  return o;
}
function getPath(obj, path){ return path.split('.').reduce((o,k)=> (o == null ? undefined : o[k]), obj); }
function setPath(obj, path, val){ const ks = path.split('.'); let o = obj; for(let i=0;i<ks.length-1;i++){ if(o[ks[i]] == null || typeof o[ks[i]] !== 'object') o[ks[i]] = {}; o = o[ks[i]]; } o[ks[ks.length-1]] = val; }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function arr(path){ let a = getPath(CONTENT, path); if(!Array.isArray(a)){ a = []; setPath(CONTENT, path, a); } return a; }
function fmtSize(n){ return n > 1048576 ? (n/1048576).toFixed(2)+' MB' : Math.round(n/1024)+' KB'; }
function contentSize(){ return new Blob([JSON.stringify(CONTENT)]).size; }

function markDirty(){ dirty = true; document.getElementById('dot').className = 'dot dirty'; document.getElementById('syncLabel').lastChild.textContent = 'Unsaved changes'; }
function markClean(){ dirty = false; document.getElementById('dot').className = 'dot'; document.getElementById('syncLabel').lastChild.textContent = lastSaved ? ('Synced · ' + new Date(lastSaved).toLocaleString()) : 'Synced'; }
window.addEventListener('beforeunload', e => { if(dirty){ e.preventDefault(); e.returnValue = ''; } });

let toastTimer;
function flash(msg, kind){ const t = document.getElementById('toast'); t.textContent = msg; t.className = 'show' + (kind === 'err' ? ' err' : ''); clearTimeout(toastTimer); toastTimer = setTimeout(()=> t.className = '', 3200); }

/* =====================================================================
   LOGIN
===================================================================== */
const loginStatus = document.getElementById('loginStatus');
function setLoginStatus(msg, kind){ loginStatus.textContent = msg; loginStatus.className = 'status' + (kind ? ' ' + kind : ''); }

(async function boot(){
  if(!SB_URL || !SB_KEY){
    setLoginStatus('⚠️ supabase-config.js is empty. Put your Project URL and anon key there first.', 'err');
    document.getElementById('loginBtn').disabled = true;
    return;
  }
  try{ await sbLoad(); setLoginStatus('Connected to Supabase ✓', 'ok'); }
  catch(e){ setLoginStatus('Cannot reach the database: ' + e.message, 'err'); }
  const saved = sessionStorage.getItem(SESSION_KEY);
  if(saved){ document.getElementById('pw').value = saved; login(saved); }
})();

document.getElementById('loginForm').addEventListener('submit', e => { e.preventDefault(); login(document.getElementById('pw').value); });

async function login(pw){
  const btn = document.getElementById('loginBtn'); btn.disabled = true; setLoginStatus('Signing in…');
  try{
    const ok = await sbRpc('check_password', { p_password: pw });
    if(ok !== true){ setLoginStatus('Wrong password', 'err'); sessionStorage.removeItem(SESSION_KEY); btn.disabled = false; return; }
    PASSWORD = pw; sessionStorage.setItem(SESSION_KEY, pw);
    await loadFromDb();
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    buildTabs(); renderTab('hero');
  }catch(e){ setLoginStatus('Error: ' + e.message, 'err'); }
  btn.disabled = false;
}

async function loadFromDb(){
  const row = await sbLoad();
  const remote = row.content || {};
  lastSaved = row.updated_at;
  CONTENT = deepMerge(deepClone(EMPTY_CONTENT), remote);
  CONTENT.__empty = !Object.keys(remote).length;
  markClean();
}

/* =====================================================================
   SAVE / RELOAD / IMPORT / EXPORT
===================================================================== */
async function doSave(){
  const btn = document.getElementById('saveBtn'); btn.disabled = true; btn.textContent = 'Saving…';
  try{
    const payload = deepClone(CONTENT); delete payload.__empty;
    const ts = await sbRpc('save_portfolio', { p_password: PASSWORD, p_content: payload });
    lastSaved = ts; CONTENT.__empty = false; markClean();
    flash('Saved to Supabase ✓ — live on the site');
    const fr = document.getElementById('previewFrame'); if(fr) fr.contentWindow.location.reload();
  }catch(e){
    if(/WRONG_PASSWORD/.test(e.message)){ flash('Session expired — please log in again', 'err'); doLogout(); }
    else flash('Save failed: ' + e.message, 'err');
  }
  btn.disabled = false; btn.textContent = '💾 Save to Supabase';
}
async function doReload(){
  if(dirty && !confirm('Discard unsaved changes and reload from the database?')) return;
  try{ await loadFromDb(); renderTab(currentTab); flash('Reloaded from Supabase'); }catch(e){ flash(e.message, 'err'); }
}
function doLogout(){ PASSWORD = ''; sessionStorage.removeItem(SESSION_KEY); location.reload(); }

/* pull the content currently baked inside index.html (first-time migration) */
async function importFromSite(){
  try{
    const html = await (await fetch('index.html', { cache: 'no-store' })).text();
    const m = html.match(/window\.__BAKED_CONTENT__\s*=\s*(\{[\s\S]*?\});\s*\n/);
    if(!m) throw new Error('No baked content found in index.html');
    const baked = (new Function('return ' + m[1]))();
    /* also grab default avatar + gallery images if the baked content lacks them */
    const av = html.match(/const AVATAR = "(data:[^"]+)"/);
    CONTENT = deepMerge(deepClone(EMPTY_CONTENT), baked);
    if(av && !CONTENT.hero.avatar) CONTENT.hero.avatar = av[1];
    CONTENT.__empty = false; markDirty(); renderTab(currentTab);
    flash('Imported from index.html ✓ — now click Save to Supabase');
  }catch(e){ flash('Import failed: ' + e.message, 'err'); }
}
function exportJson(){
  const payload = deepClone(CONTENT); delete payload.__empty;
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'}));
  a.download = 'portfolio-backup-' + new Date().toISOString().slice(0,10) + '.json'; a.click();
}

/* =====================================================================
   FILE HELPERS (free tier: images compressed → base64 inside the JSON)
===================================================================== */
function pickFile(accept, cb){ const inp = document.getElementById('fileInput'); inp.accept = accept || '*/*'; inp.onchange = ()=>{ const f = inp.files[0]; inp.value = ''; if(f) cb(f); }; inp.click(); }
function compressImage(file, maxW, quality){
  return new Promise((res, rej)=>{
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = ()=>{
      const sc = Math.min(1, maxW / img.width); const c = document.createElement('canvas');
      c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL(file.type === 'image/png' && file.size < 300000 ? 'image/png' : 'image/jpeg', quality || .82));
    };
    img.onerror = rej; img.src = url;
  });
}
function readAsDataURL(file){ return new Promise((res, rej)=>{ const r = new FileReader(); r.onload = ()=> res(r.result); r.onerror = rej; r.readAsDataURL(file); }); }
const MAX_ATTACH = 2.5 * 1024 * 1024;

/* =====================================================================
   UI BUILDING BLOCKS
===================================================================== */
const ICON_OPTS = ['bolt','gear','robot','code','users','globe','cert'];
const ACCENT_OPTS = ['cyan','emerald','violet','amber','rose'];
function field(label, path, o){
  o = o || {}; const v = getPath(CONTENT, path);
  let inp;
  if(o.type === 'textarea') inp = '<textarea data-path="'+path+'"'+(o.code ? ' class="code"' : '')+' placeholder="'+esc(o.ph||'')+'">'+esc(v)+'</textarea>';
  else if(o.type === 'select') inp = '<select data-path="'+path+'">'+o.options.map(x=>'<option value="'+x+'"'+(x===v?' selected':'')+'>'+x+'</option>').join('')+'</select>';
  else inp = '<input data-path="'+path+'" value="'+esc(v)+'" placeholder="'+esc(o.ph||'')+'">';
  return '<div class="f"><label>'+esc(label)+'</label>'+inp+(o.hint ? '<div class="hint">'+o.hint+'</div>' : '')+'</div>';
}
function listField(label, path, hint){   /* newline-separated list (bullets, typeWords) */
  const v = arr(path).join('\n');
  return '<div class="f"><label>'+esc(label)+'</label><textarea data-list="'+path+'" placeholder="One per line">'+esc(v)+'</textarea><div class="hint">'+(hint||'One item per line.')+'</div></div>';
}
function chipsField(label, path){
  const a = arr(path);
  return '<div class="f"><label>'+esc(label)+'</label><div class="chip-row" style="margin-bottom:8px">'+
    a.map((c,i)=>'<span class="chip-edit">'+esc(c)+'<button data-act="chip-del" data-path="'+path+'" data-i="'+i+'">×</button></span>').join('')+
    '</div><div style="display:flex;gap:8px"><input data-chip-input="'+path+'" placeholder="New item… (Enter)"><button class="mini" data-act="chip-add" data-path="'+path+'">+ Add</button></div></div>';
}
function itemHead(label, path, i, n){
  return '<div class="it-head"><b>'+esc(label)+'</b>'+
    '<button class="mini" data-act="move" data-path="'+path+'" data-i="'+i+'" data-d="-1"'+(i===0?' disabled':'')+'>↑</button>'+
    '<button class="mini" data-act="move" data-path="'+path+'" data-i="'+i+'" data-d="1"'+(i===n-1?' disabled':'')+'>↓</button>'+
    '<button class="mini danger" data-act="del" data-path="'+path+'" data-i="'+i+'">Delete</button></div>';
}
function attachmentsField(path){
  const a = arr(path);
  return '<div class="f"><label>📎 Attachments (files / YouTube / links)</label>'+
    a.map((at,i)=>'<div class="att"><span>'+(at.data?'📁':'🔗')+' '+esc(at.name || at.url)+'</span>'+(at.data ? '<small>'+fmtSize(at.data.length*0.75)+'</small>' : '')+
      '<button class="mini danger" data-act="del" data-path="'+path+'" data-i="'+i+'">×</button></div>').join('')+
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">'+
      '<button class="mini" data-act="att-file" data-path="'+path+'">⬆ Upload file (max 2.5 MB)</button>'+
      '<input data-att-url="'+path+'" placeholder="https://youtube.com/… or any link" style="flex:1;min-width:200px">'+
      '<button class="mini" data-act="att-link" data-path="'+path+'">+ Add link</button></div></div>';
}
function sectionHeader(key, withSub){
  return '<div class="card"><h3>Section header<span class="line"></span></h3>'+
    '<div class="row">'+field('Eyebrow', key+'.eyebrow')+field('Title', key+'.title')+'</div>'+
    (withSub ? field('Subtitle', key+'.sub', {type:'textarea'}) : '')+'</div>';
}

function blockHTML(bp, blk, k, n){
  let inner = '';
  if(blk.type === 'paragraph') inner = field('Title',bp+'.title')+field('Text',bp+'.text',{type:'textarea'})+attachmentsField(bp+'.attachments');
  else if(blk.type === 'cards') inner = (blk.items||[]).map((c,ci,ca)=>'<div class="item" style="padding:12px">'+itemHead('Card '+(ci+1),bp+'.items',ci,ca.length)+
      '<div class="row">'+field('Icon',bp+'.items.'+ci+'.icon',{type:'select',options:ICON_OPTS})+field('Title',bp+'.items.'+ci+'.title')+'</div>'+field('Text',bp+'.items.'+ci+'.text',{type:'textarea'})+attachmentsField(bp+'.items.'+ci+'.attachments')+'</div>').join('')+addBtn('Add card',bp+'.items',{icon:'gear',title:'',text:''});
  else if(blk.type === 'chips') inner = chipsField('Chips',bp+'.items');
  else if(blk.type === 'link') inner = '<div class="row">'+field('Button text',bp+'.title')+field('URL',bp+'.url')+'</div>';
  else if(blk.type === 'image') inner = field('Alt / caption',bp+'.title')+(blk.src ? '<div class="thumb" style="width:200px;height:120px;margin-bottom:8px"><img src="'+blk.src+'"></div>' : '')+'<button class="mini" data-act="img-set" data-path="'+bp+'.src">⬆ Upload image</button>';
  return '<div class="item">'+itemHead(blk.type.toUpperCase()+' block', bp.replace(/\.\d+$/,''), k, n)+inner+'</div>';
}

function renderTab(tab){
  currentTab = tab;
  document.querySelectorAll('#tabs .tab').forEach(b=> b.classList.toggle('active', b.dataset.tab === tab));
  document.getElementById('main').innerHTML = R[tab] ? R[tab]() : '';
  window.scrollTo(0,0);
  if(tab === 'preview'){ const fr = document.getElementById('previewFrame'); fr.onload = pushPreview; }
}
function pushPreview(){ const fr = document.getElementById('previewFrame'); if(fr && fr.contentWindow){ const c = deepClone(CONTENT); delete c.__empty; fr.contentWindow.postMessage({type:'mm-preview', content:c}, '*'); } }

/* =====================================================================
   EVENTS
===================================================================== */
document.getElementById('tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if(b) renderTab(b.dataset.tab); });
document.querySelector('header').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if(!b) return;
  if(b.dataset.act === 'save') doSave(); else if(b.dataset.act === 'reload') doReload(); else if(b.dataset.act === 'logout'){ if(!dirty || confirm('Unsaved changes will be lost. Logout?')) doLogout(); }
});
document.addEventListener('keydown', e => { if((e.ctrlKey||e.metaKey) && e.key.toLowerCase() === 's'){ e.preventDefault(); doSave(); } });

const main = document.getElementById('main');
main.addEventListener('input', e => {
  const t = e.target;
  if(t.dataset.path){ let v = t.value; if(t.tagName === 'SELECT' && /^\d+$/.test(v)) v = +v; setPath(CONTENT, t.dataset.path, v); markDirty(); }
  else if(t.dataset.list){ setPath(CONTENT, t.dataset.list, t.value.split('\n').map(s=>s.trim()).filter(Boolean)); markDirty(); }
});
main.addEventListener('change', e => {
  const t = e.target;
  if(t.dataset.bool){ setPath(CONTENT, t.dataset.bool, t.checked); markDirty(); }
});
main.addEventListener('keydown', e => {
  if(e.key === 'Enter' && e.target.dataset.chipInput){ e.preventDefault(); addChip(e.target.dataset.chipInput, e.target.value); }
});
function addChip(path, val){ val = (val||'').trim(); if(!val) return; arr(path).push(val); markDirty(); renderTab(currentTab); setTimeout(()=>{ const i = main.querySelector('[data-chip-input="'+path+'"]'); if(i) i.focus(); }, 0); }

main.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if(!b) return;
  const act = b.dataset.act, path = b.dataset.path, i = +b.dataset.i;
  if(act === 'add'){ arr(path).push(JSON.parse(b.dataset.tpl)); markDirty(); renderTab(currentTab); return; }
  if(act === 'del'){ if(b.closest('.att') || b.closest('.thumb') || confirm('Delete this item?')){ arr(path).splice(i,1); markDirty(); renderTab(currentTab); } return; }
  if(act === 'move'){ const a = arr(path), j = i + (+b.dataset.d); if(j<0||j>=a.length) return; [a[i],a[j]] = [a[j],a[i]]; markDirty(); renderTab(currentTab); return; }
  if(act === 'chip-add'){ addChip(path, main.querySelector('[data-chip-input="'+path+'"]').value); return; }
  if(act === 'chip-del'){ arr(path).splice(i,1); markDirty(); renderTab(currentTab); return; }
  if(act === 'photo'){ pickFile('image/*', async f => { CONTENT.hero.avatar = await compressImage(f, 600, .85); markDirty(); renderTab(currentTab); }); return; }
  if(act === 'photo-del'){ delete CONTENT.hero.avatar; markDirty(); renderTab(currentTab); return; }
  if(act === 'img-add'){ pickFile('image/*', async f => { arr(path).push(await compressImage(f, 1200, .8)); markDirty(); renderTab(currentTab); }); return; }
  if(act === 'img-set'){ pickFile('image/*', async f => { setPath(CONTENT, path, await compressImage(f, 1400, .8)); markDirty(); renderTab(currentTab); }); return; }
  if(act === 'att-file'){ pickFile('*/*', async f => {
      if(f.size > MAX_ATTACH){ flash('File too big (max 2.5 MB). Upload it to Google Drive / YouTube and add the link instead.', 'err'); return; }
      const data = /^image\//.test(f.type) ? await compressImage(f, 1400, .8) : await readAsDataURL(f);
      arr(path).push({ name: f.name, data }); markDirty(); renderTab(currentTab); }); return; }
  if(act === 'att-link'){ const inp = main.querySelector('[data-att-url="'+path+'"]'); const u = (inp.value||'').trim(); if(!/^https?:\/\//.test(u)){ flash('Enter a valid link starting with https://', 'err'); return; }
      arr(path).push({ name: u.replace(/^https?:\/\//,'').slice(0,60), url: u }); markDirty(); renderTab(currentTab); return; }
  if(act === 'import'){ if(!CONTENT.__empty && !confirm('This replaces your current edits with the content baked in index.html. Continue?')) return; importFromSite(); return; }
  if(act === 'export'){ exportJson(); return; }
  if(act === 'restore'){ pickFile('application/json', async f => { try{ const j = JSON.parse(await f.text()); CONTENT = deepMerge(deepClone(EMPTY_CONTENT), j); CONTENT.__empty = false; markDirty(); renderTab(currentTab); flash('Restored — click Save'); }catch(err){ flash('Invalid JSON', 'err'); } }); return; }
  if(act === 'change-pass'){
    const a = document.getElementById('newPass').value, c = document.getElementById('newPass2').value;
    if(a.length < 4){ flash('Min 4 characters', 'err'); return; } if(a !== c){ flash('Passwords do not match', 'err'); return; }
    try{ await sbRpc('change_password', { p_old: PASSWORD, p_new: a }); PASSWORD = a; sessionStorage.setItem(SESSION_KEY, a); flash('Password changed ✓'); document.getElementById('newPass').value = document.getElementById('newPass2').value = ''; }
    catch(err){ flash('Failed: ' + err.message, 'err'); } return; }
  if(act === 'pv-desktop' || act === 'pv-mobile'){ document.getElementById('previewFrame').classList.toggle('mobile', act === 'pv-mobile'); return; }
  if(act === 'pv-refresh'){ const fr = document.getElementById('previewFrame'); fr.src = 'index.html?preview=' + Date.now(); return; }
});
