function deepClone(x){ return JSON.parse(JSON.stringify(x)); }
function deepMerge(base, over){
  const o = Array.isArray(base) ? [] : {};
  for(const k in base){
    if(over && over[k] !== undefined && typeof over[k] === "object" && over[k] !== null && !Array.isArray(over[k]) && typeof base[k] === "object" && base[k] !== null && !Array.isArray(base[k])){ o[k] = deepMerge(base[k], over[k]); }
    else if(over && over[k] !== undefined){ o[k] = deepClone(over[k]); }
    else { o[k] = deepClone(base[k]); }
  }
  if(over){ for(const k in over){ if(base[k] === undefined){ o[k] = deepClone(over[k]); } } }
  return o;
}
function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function getPath(obj, path){ return path.split(".").reduce((o,k)=> (o && o[k] !== undefined) ? o[k] : undefined, obj); }
function setPath(obj, path, val){
  const ks = path.split("."); let o = obj;
  for(let i=0;i<ks.length-1;i++){ if(o[ks[i]] === undefined) o[ks[i]] = {}; o = o[ks[i]]; }
  o[ks[ks.length-1]] = val;
}
function storeGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function storeSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }
function storeDel(k){ try{ localStorage.removeItem(k); return true; }catch(e){ return false; } }

function field(label, path, opts){
  opts = opts || {};
  const v = getPath(CONTENT, path);
  const valStr = v == null ? "" : String(v);
  let inp;
  if(opts.type === 'textarea'){
    inp = '<textarea data-path="'+path+'" rows="'+(opts.rows||3)+'">'+esc(valStr)+'</textarea>';
  } else if(opts.type === 'select'){
    inp = '<select data-path="'+path+'">'+opts.options.map(o=>{
      const val = typeof o === 'object' ? o.v : o;
      const lab = typeof o === 'object' ? o.l : o;
      return '<option value="'+esc(val)+'"'+(String(v)===val?' selected':'')+'>'+esc(lab)+'</option>';
    }).join('')+'</select>';
  } else {
    inp = '<input data-path="'+path+'" value="'+esc(valStr)+'"'+(opts.csv?' data-csv="1"':'')+(opts.placeholder?' placeholder="'+esc(opts.placeholder)+'"':'')+'>';
  }
  return '<div class="f"><label>'+esc(label)+'</label>'+inp+(opts.hint?'<small>'+esc(opts.hint)+'</small>':'')+'</div>';
}

function bulletsEditor(arrKey, i){
  const arr = getPath(CONTENT, arrKey) || [];
  const b = arr[i] ? (arr[i].bullets||[]) : [];
  const rows = b.map((x,j)=>(
    '<div class="f" style="margin-bottom:8px;display:flex;gap:8px">'+
      '<input data-path="'+arrKey+'.'+i+'.bullets.'+j+'" value="'+esc(x)+'" style="flex:1">'+
      '<button class="mini danger" data-act="del-bullet" data-arr="'+arrKey+'" data-i="'+i+'" data-b="'+j+'">×</button>'+
    '</div>'
  )).join('');
  return rows + '<button class="mini" data-act="add-bullet" data-arr="'+arrKey+'" data-i="'+i+'">+ Add point</button>';
}

function itemHeader(label, act, arrKey, i){
  return '<div class="it-head"><b>'+esc(label)+'</b>'+
    '<span style="display:flex;gap:6px">'+
      '<button class="mini" data-act="move" data-arr="'+arrKey+'" data-i="'+i+'" data-dir="-1" title="Move up">↑</button>'+
      '<button class="mini" data-act="move" data-arr="'+arrKey+'" data-i="'+i+'" data-dir="1" title="Move down">↓</button>'+
      '<button class="mini danger" data-act="'+act+'" data-arr="'+arrKey+'" data-i="'+i+'">🗑 Remove</button>'+
    '</span></div>';
}

function defaultBlock(type){
  if(type === 'paragraph') return { type:'paragraph', title:'', text:'' };
  if(type === 'cards') return { type:'cards', items:[{icon:'gear', title:'New card', text:''}] };
  if(type === 'chips') return { type:'chips', items:['New tag'] };
  if(type === 'link') return { type:'link', title:'Button label', url:'#' };
  if(type === 'image') return { type:'image', title:'', src:'' };
  return { type:'paragraph', title:'', text:'' };
}

function blockEditor(si, bi, b){
  const labels = { paragraph:'📝 Text', cards:'🃏 Cards', chips:'🏷️ Tags', link:'🔗 Link', image:'🖼️ Image' };
  const head = '<div class="it-head"><b>'+(labels[b.type]||b.type)+'</b>'+
    '<span style="display:flex;gap:6px">'+
      '<button class="mini" data-act="move-block" data-si="'+si+'" data-bi="'+bi+'" data-dir="-1">↑</button>'+
      '<button class="mini" data-act="move-block" data-si="'+si+'" data-bi="'+bi+'" data-dir="1">↓</button>'+
      '<button class="mini danger" data-act="del-block" data-si="'+si+'" data-bi="'+bi+'">×</button>'+
    '</span></div>';
  let body = '';
  if(b.type === 'paragraph'){
    body = field('Title (optional)','custom.sections.'+si+'.blocks.'+bi+'.title')+
           field('Text','custom.sections.'+si+'.blocks.'+bi+'.text',{type:'textarea',rows:3});
  } else if(b.type === 'cards'){
    body = '<label style="display:block;font-size:12px;color:var(--muted);margin:8px 0 6px;font-weight:600">Cards</label>'+
      (b.items||[]).map((c,ci)=>(
        '<div class="item" style="padding:10px;margin-bottom:8px">'+
          '<div class="it-head"><b>Card '+(ci+1)+'</b>'+
            '<button class="mini danger" data-act="del-card" data-si="'+si+'" data-bi="'+bi+'" data-ci="'+ci+'">×</button></div>'+
          '<div class="row">'+
            field('Icon','custom.sections.'+si+'.blocks.'+bi+'.items.'+ci+'.icon',{type:'select',options:ICON_OPTS})+
            field('Title','custom.sections.'+si+'.blocks.'+bi+'.items.'+ci+'.title')+
          '</div>'+
          field('Text','custom.sections.'+si+'.blocks.'+bi+'.items.'+ci+'.text',{type:'textarea',rows:2})+
        '</div>'
      )).join('')+
      '<button class="mini" data-act="add-card" data-si="'+si+'" data-bi="'+bi+'">+ Add card</button>';
  } else if(b.type === 'chips'){
    body = '<div class="chip-row" style="margin-top:0">'+
      (b.items||[]).map((c,ci)=>(
        '<span class="chip-edit"><input data-path="custom.sections.'+si+'.blocks.'+bi+'.items.'+ci+'" value="'+esc(c)+'">'+
        '<button data-act="del-chip-block" data-si="'+si+'" data-bi="'+bi+'" data-ci="'+ci+'">×</button></span>'
      )).join('')+
      '<button class="mini" data-act="add-chip-block" data-si="'+si+'" data-bi="'+bi+'">+</button></div>';
  } else if(b.type === 'link'){
    body = '<div class="row">'+
      field('Button label','custom.sections.'+si+'.blocks.'+bi+'.title')+
      field('URL','custom.sections.'+si+'.blocks.'+bi+'.url')+
    '</div>';
  } else if(b.type === 'image'){
    body = '<div class="avatar-wrap">'+
      (b.src ? '<img class="avatar-pre" style="border-radius:12px" src="'+b.src+'" alt="">' :
               '<div class="avatar-pre" style="border-radius:12px;display:grid;place-items:center;font-size:11px;color:var(--muted);padding:8px">No image</div>')+
      '<div style="display:flex;flex-direction:column;gap:8px">'+
        '<button class="mini" data-act="upload-block-image" data-si="'+si+'" data-bi="'+bi+'">🖼 Upload image</button>'+
        (b.src ? '<button class="mini danger" data-act="remove-block-image" data-si="'+si+'" data-bi="'+bi+'">Remove</button>' : '')+
      '</div></div>'+
      field('Caption (optional)','custom.sections.'+si+'.blocks.'+bi+'.title');
  }
  return '<div class="item" style="padding:12px;border-style:solid">'+head+body+'</div>';
}

        '📦 <b>Download updated site</b> bakes your edits into a new index.html you can deploy anywhere (GitHub Pages, Netlify…).<br>'+
        '⬇ <b>Export JSON</b> saves a backup file. ⬆ <b>Import</b> restores it.</p>'+
      '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
        '<button class="btn primary" data-act="download">📦 Download updated site</button>'+
        '<button class="btn" data-act="export">⬇ Export JSON</button>'+
        '<button class="btn" data-act="import">⬆ Import JSON</button>'+
        '<button class="btn danger" data-act="reset">↺ Reset to default</button>'+
      '</div>'+
    '</div>'+
    '<div class="card"><h3>Show / hide sections<span class="line"></span></h3>'+
      '<p style="color:var(--muted);font-size:13px;margin-bottom:12px">Toggle which sections appear on the portfolio page.</p>'+
      '<div class="row">'+
        Object.keys(CONTENT.settings.sections).map(key=>(
          '<label class="switch-row"><input type="checkbox" data-section="'+key+'"'+(CONTENT.settings.sections[key]?' checked':'')+'><span>'+esc(key.charAt(0).toUpperCase()+key.slice(1))+'</span></label>'
        )).join('')+
      '</div>'+
    '</div>';
}

const RENDERERS = { hero:renderHero, about:renderAbout, education:function(){return timelineTab('education','Education','Academic background.');}, experience:function(){return timelineTab('experience','Experience','Work & activities.');}, services:renderServices, skills:renderSkills, projects:renderProjects, certs:renderCerts, testimonials:renderTestimonials, contact:renderContact, footer:renderFooter, custom:renderCustom, settings:renderSettings, preview:renderPreview };

function renderTab(tab){
  currentTab = tab;
  document.querySelectorAll('#tabs .tab').forEach(b=> b.classList.toggle('active', b.dataset.tab === tab));
  document.getElementById('main').innerHTML = RENDERERS[tab] ? RENDERERS[tab]() : '';
}

/* =====================================================================
   LIVE BINDING + ACTIONS
===================================================================== */
document.getElementById('main').addEventListener('input', function(e){
  const t = e.target;
  if(!t.dataset.path) return;
  if(t.type === 'checkbox'){ setPath(CONTENT, t.dataset.path, t.checked); markDirty(); return; }
  const val = t.value;
  if(t.dataset.csv !== undefined){
    setPath(CONTENT, t.dataset.path, val.split(',').map(s=>s.trim()).filter(Boolean));
  } else {
    setPath(CONTENT, t.dataset.path, val);
  }
  markDirty();
});

function markDirty(){
  dirty = true;
  const st = document.getElementById('status');
  st.textContent = 'Unsaved changes';
  st.classList.add('dirty');
}
function markSaved(){
  dirty = false;
  const st = document.getElementById('status');
  st.textContent = 'All changes saved';
  st.classList.remove('dirty');
}

function defaultItemFor(arrKey){
  if(arrKey === 'projects.items') return { title:'New Project', year:'2026', tag:'Category', role:'Role: your role', visual:'generic', bullets:['Short description of the project.'], github:'#', demo:'#', code:'' };
  if(arrKey === 'certifications.certs') return { code:'CODE', issuer:'Issuer', desc:'Short description.' };
  if(arrKey === 'about.cards') return { icon:'gear', title:'New Card', body:'Short description.' };
  if(arrKey === 'skills.groups') return { icon:'code', title:'New Group', chips:['New Skill'] };
  return { title:'New Entry', role:'Role / Position', when:'2026', grade:'', bullets:['Describe this item.'] };
}

document.addEventListener('click', function(e){
  const b = e.target.closest('[data-act], [data-tab]');
  if(!b) return;

  if(b.dataset.tab){ renderTab(b.dataset.tab); return; }
  const act = b.dataset.act;

  if(act === 'save'){ doSave(); return; }
  if(act === 'export'){ doExport(); return; }
  if(act === 'import'){ document.getElementById('importFile').click(); return; }
  if(act === 'download'){ doDownload(); return; }
  if(act === 'reset'){ doReset(); return; }
  if(act === 'logout'){ doLogout(); return; }
  if(act === 'change-pass'){ doChangePass(); return; }
  if(act === 'change-photo'){ document.getElementById('photoFile').click(); return; }
  if(act === 'remove-photo'){ delete CONTENT.hero.avatar; markDirty(); renderTab(currentTab); flash('Photo removed'); return; }
  if(act === 'refresh-preview'){
    const f = document.getElementById('previewFrame');
    if(f) f.src = f.src;
    flash('Preview refreshed');
    return;
  }
  if(act === 'toggle-mobile'){
    previewMobile = !previewMobile;
    const f = document.getElementById('previewFrame');
    const btn = document.getElementById('mobileToggleBtn');
    if(f){
      if(previewMobile){ f.style.width = '390px'; f.style.maxWidth = '100%'; if(btn) btn.textContent = '🖥 Desktop view'; }
      else { f.style.width = '100%'; if(btn) btn.textContent = '📱 Mobile view'; }
    }
    return;
  }

  if(act === 'move'){
    const arr = getPath(CONTENT, b.dataset.arr) || [];
    const i = parseInt(b.dataset.i,10), dir = parseInt(b.dataset.dir,10);
    const j = i + dir;
    if(j >= 0 && j < arr.length){
      const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
      markDirty(); renderTab(currentTab);
    }
    return;
  }
  if(act === 'add-img'){
    lastImgIndex = parseInt(b.dataset.i,10);
    document.getElementById('projImagesFile').click();
    return;
  }
  if(act === 'del-img'){
    const it = CONTENT.projects.items[parseInt(b.dataset.i,10)];
    if(it && it.images) it.images.splice(parseInt(b.dataset.j,10),1);
    markDirty(); renderTab(currentTab);
    return;
  }

  /* ---- custom sections ("Add Anything") ---- */
  const cs = CONTENT.custom && CONTENT.custom.sections ? CONTENT.custom.sections : (CONTENT.custom = { sections: [] }, CONTENT.custom.sections);
  const si = parseInt(b.dataset.si,10), bi = parseInt(b.dataset.bi,10);

  if(act === 'add-section'){
    cs.push({ eyebrow:'', title:'New Section', sub:'', visible:true, blocks:[] });
    markDirty(); renderTab(currentTab); return;
  }
  if(act === 'del-section'){ cs.splice(si,1); markDirty(); renderTab(currentTab); return; }
  if(act === 'move-section'){
    const j = si + parseInt(b.dataset.dir,10);
    if(j >= 0 && j < cs.length){ const tmp = cs[si]; cs[si] = cs[j]; cs[j] = tmp; markDirty(); renderTab(currentTab); }
    return;
  }
  if(act === 'add-block'){
    const sec = cs[si]; if(!sec) return;
    sec.blocks = sec.blocks || [];
    sec.blocks.push(defaultBlock(b.dataset.type));
    markDirty(); renderTab(currentTab); return;
  }
  if(act === 'del-block'){ const sec = cs[si]; if(sec && sec.blocks) sec.blocks.splice(bi,1); markDirty(); renderTab(currentTab); return; }
  if(act === 'move-block'){
    const sec = cs[si]; if(!sec || !sec.blocks) return;
    const j = bi + parseInt(b.dataset.dir,10);
    if(j >= 0 && j < sec.blocks.length){ const tmp = sec.blocks[bi]; sec.blocks[bi] = sec.blocks[j]; sec.blocks[j] = tmp; markDirty(); renderTab(currentTab); }
    return;
  }
  if(act === 'add-card'){
    const blk = cs[si] && cs[si].blocks ? cs[si].blocks[bi] : null;
    if(blk){ blk.items = blk.items || []; blk.items.push({icon:'gear', title:'New card', text:''}); markDirty(); renderTab(currentTab); }
    return;
  }
  if(act === 'del-card'){
    const blk = cs[si] && cs[si].blocks ? cs[si].blocks[bi] : null;
    if(blk && blk.items) blk.items.splice(parseInt(b.dataset.ci,10),1);
    markDirty(); renderTab(currentTab); return;
  }
  if(act === 'add-chip-block'){
    const blk = cs[si] && cs[si].blocks ? cs[si].blocks[bi] : null;
    if(blk){ blk.items = blk.items || []; blk.items.push('New tag'); markDirty(); renderTab(currentTab); }
    return;
  }
  if(act === 'del-chip-block'){
    const blk = cs[si] && cs[si].blocks ? cs[si].blocks[bi] : null;
    if(blk && blk.items) blk.items.splice(parseInt(b.dataset.ci,10),1);
    markDirty(); renderTab(currentTab); return;
  }
  if(act === 'upload-block-image'){
    lastBlockImage = { si:si, bi:bi };
    document.getElementById('blockImageFile').click();
    return;
  }
  if(act === 'remove-block-image'){
    const blk = cs[si] && cs[si].blocks ? cs[si].blocks[bi] : null;
    if(blk){ blk.src = ''; markDirty(); renderTab(currentTab); }
    return;
  }

  if(act === 'add-item'){
    const arr = getPath(CONTENT, b.dataset.arr) || [];
    arr.push(defaultItemFor(b.dataset.arr)); markDirty(); renderTab(currentTab); return;
  }
  if(act === 'del-item'){
    const arr = getPath(CONTENT, b.dataset.arr) || [];
    arr.splice(parseInt(b.dataset.i,10),1); markDirty(); renderTab(currentTab); return;
  }
  if(act === 'add-stat'){ CONTENT.hero.stats.push({value:'0',decimals:0,label:'New stat'}); markDirty(); renderTab(currentTab); return; }
  if(act === 'del-stat'){ CONTENT.hero.stats.splice(parseInt(b.dataset.i,10),1); markDirty(); renderTab(currentTab); return; }
  if(act === 'add-tag'){ CONTENT.hero.tags = CONTENT.hero.tags || []; CONTENT.hero.tags.push('New tag'); markDirty(); renderTab(currentTab); return; }
  if(act === 'del-tag'){ if(CONTENT.hero.tags) CONTENT.hero.tags.splice(parseInt(b.dataset.i,10),1); markDirty(); renderTab(currentTab); return; }
  if(act === 'add-bullet'){
    const arr = getPath(CONTENT, b.dataset.arr) || [];
    const it = arr[parseInt(b.dataset.i,10)];
    if(it){ it.bullets = it.bullets || []; it.bullets.push('New point'); }
    markDirty(); renderTab(currentTab); return;
  }
  if(act === 'del-bullet'){
    const arr = getPath(CONTENT, b.dataset.arr) || [];
    const it = arr[parseInt(b.dataset.i,10)];
    if(it && it.bullets) it.bullets.splice(parseInt(b.dataset.b,10),1);
    markDirty(); renderTab(currentTab); return;
  }
  if(act === 'add-chip'){
    const g = CONTENT.skills.groups[parseInt(b.dataset.g,10)];
    if(g){ g.chips.push('New Skill'); markDirty(); renderTab(currentTab); }
    return;
  }
  if(act === 'del-chip'){
    const g = CONTENT.skills.groups[parseInt(b.dataset.g,10)];
    if(g){ g.chips.splice(parseInt(b.dataset.i,10),1); markDirty(); renderTab(currentTab); }
    return;
  }
});

/* =====================================================================
   ACTIONS
===================================================================== */
function doSave(){
  storeSet(STORE_KEY, JSON.stringify(CONTENT));
  markSaved();
  flash('Saved ✓');
  fetch('/api/save', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(CONTENT) })
    .then(function(r){ return r.ok ? r.json() : Promise.reject(new Error('http '+r.status)); })
    .then(function(){ serverConnected = true; updateServerStatus(); flash('Saved ✓ — index.html updated'); })
    .catch(function(){ serverConnected = false; updateServerStatus(); flash('Saved in browser — use "Download updated site" to update the file','err'); });
}
function doExport(){
  const blob = new Blob([JSON.stringify(CONTENT, null, 2)], {type:'application/json'});
  triggerDownload(blob, 'portfolio-content.json');
  flash('Exported ✓');
}
function doImport(){ document.getElementById('importFile').click(); }
function doReset(){
  if(!confirm('Reset ALL content to the default version?')) return;
  storeDel(STORE_KEY);
  CONTENT = deepClone(DEFAULT_CONTENT);
  markSaved();
  renderTab(currentTab);
  flash('Reset to default');
}
function doLogout(){
  if(dirty && !confirm('You have unsaved changes. Logout anyway?')) return;
  sessDel(AUTH_KEY);
  location.reload();
}
function doChangePass(){
  const v = document.getElementById('newPass').value.trim();
  if(v.length < 4){ flash('Password must be at least 4 characters','err'); return; }
  storeSet(PASS_KEY, v);
  document.getElementById('newPass').value = '';
  flash('Password updated ✓');
}
function getPass(){ return storeGet(PASS_KEY) || DEFAULT_PASS; }

function triggerDownload(blob, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* bake content into a fresh index.html */
function injectContent(html){
  const baked = JSON.stringify(CONTENT).replace(/</g,'\\u003c');
  const newLine = 'window.__BAKED_CONTENT__ = '+baked+';';
  const re = /window\.__BAKED_CONTENT__\s*=\s*[^;]*;/;
  if(!re.test(html)){ throw new Error('marker-not-found'); }
  return html.replace(re, newLine);
}

function doDownload(){
  flash('Building site…');
  fetch('index.html')
    .then(r => { if(!r.ok) throw new Error('http'); return r.text(); })
    .then(html => {
      const out = injectContent(html);
      triggerDownload(new Blob([out], {type:'text/html'}), 'index.html');
      flash('index.html downloaded ✓');
    })
    .catch(()=>{
      flash('Failed to fetch index.html — open dashboard from the site URL','err');
      alert('Could not fetch index.html.\n\nMake sure you open the dashboard from the live site URL (e.g. https://…/dashboard.html), not as a local file.\n\nAlternative: use "Export JSON" and bake the file manually.');
    });
}

/* =====================================================================
   LOGIN
===================================================================== */
function tryLogin(){
  const v = document.getElementById('passInput').value;
  if(v === getPass()){
    sessSet(AUTH_KEY, '1');
    showApp();
  } else {
    document.getElementById('gateErr').textContent = 'Wrong password';
  }
}
function showApp(){
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').classList.add('on');
  renderTab('hero');
  markSaved();
  pingServer();
  // if no local copy exists, load the latest persisted content from the server
  if(!storeGet(STORE_KEY)){
    fetch('/api/load').then(function(r){ return r.ok ? r.json() : null; }).then(function(d){
      if(d && Object.keys(d).length){
        CONTENT = deepMerge(deepClone(DEFAULT_CONTENT), d);
        renderTab(currentTab);
        flash('Loaded latest saved content');
      }
    }).catch(function(){});
  }
}
document.getElementById('loginBtn').addEventListener('click', tryLogin);
document.getElementById('passInput').addEventListener('keydown', e=>{ if(e.key === 'Enter') tryLogin(); });

/* file inputs */
document.getElementById('importFile').addEventListener('change', function(e){
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = function(){
    try{
      CONTENT = deepMerge(deepClone(DEFAULT_CONTENT), JSON.parse(r.result));
      markDirty(); renderTab(currentTab); flash('Imported ✓ — click Save');
    }catch(err){ flash('Invalid JSON file','err'); }
  };
  r.readAsText(f);
  e.target.value = '';
});
document.getElementById('photoFile').addEventListener('change', function(e){
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = function(){
    const img = new Image();
    img.onload = function(){
      const max = 720;
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width*scale); cv.height = Math.round(img.height*scale);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      CONTENT.hero.avatar = cv.toDataURL('image/jpeg', 0.85);
      markDirty(); renderTab(currentTab); flash('Photo uploaded ✓ — click Save');
    };
    img.src = r.result;
  };
  r.readAsDataURL(f);
  e.target.value = '';
});

/* custom block image upload */
let lastBlockImage = null;
document.getElementById('blockImageFile').addEventListener('change', function(e){
  const f = e.target.files[0]; if(!f || !lastBlockImage) return;
  const r = new FileReader();
  r.onload = function(){
    const img = new Image();
    img.onload = function(){
      const max = 900;
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width*scale); cv.height = Math.round(img.height*scale);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      const cs = CONTENT.custom.sections;
      const blk = cs[lastBlockImage.si] && cs[lastBlockImage.si].blocks ? cs[lastBlockImage.si].blocks[lastBlockImage.bi] : null;
      if(blk){ blk.src = cv.toDataURL('image/jpeg', 0.8); markDirty(); renderTab(currentTab); flash('Image added ✓'); }
    };
    img.src = r.result;
  };
  r.readAsDataURL(f);
  e.target.value = '';
});

/* mobile preview state */
let previewMobile = false;

/* server connection state */
let serverConnected = null;
function updateServerStatus(){
  const el = document.getElementById('serverStatus');
  if(!el) return;
  if(serverConnected === true){ el.textContent = '🟢 Server connected — edits update index.html automatically'; el.style.color = 'var(--green)'; }
  else if(serverConnected === false){ el.textContent = '🟠 No write access — use "Download updated site"'; el.style.color = '#fbbf24'; }
  else { el.textContent = 'Checking server…'; el.style.color = 'var(--muted)'; }
}
function pingServer(){
  fetch('/api/ping').then(function(r){ return r.ok ? r.json() : Promise.reject(new Error()); })
    .then(function(){ serverConnected = true; updateServerStatus(); })
    .catch(function(){ serverConnected = false; updateServerStatus(); });
}

/* project images upload */
let lastImgIndex = 0;
document.getElementById('projImagesFile').addEventListener('change', function(e){
  const files = Array.from(e.target.files || []);
  if(!files.length) return;
  const pr = CONTENT.projects.items[lastImgIndex];
  if(!pr){ return; }
  pr.images = pr.images || [];
  let done = 0;
  files.forEach(f=>{
    const r = new FileReader();
    r.onload = function(){
      const img = new Image();
      img.onload = function(){
        const max = 900;
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.width*scale); cv.height = Math.round(img.height*scale);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        pr.images.push(cv.toDataURL('image/jpeg', 0.8));
        done++;
        if(done === files.length){ markDirty(); renderTab(currentTab); flash(files.length+' photo(s) added ✓'); }
      };
      img.src = r.result;
    };
    r.readAsDataURL(f);
  });
  e.target.value = '';
});

/* section visibility checkboxes */
document.getElementById('main').addEventListener('change', function(e){
  const t = e.target;
  if(t.dataset.section){
    CONTENT.settings.sections[t.dataset.section] = t.checked;
    markDirty();
  }
});

/* toast */
let toastTimer = null;
function flash(msg, cls){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (cls ? ' '+cls : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.className = 'toast', 2500);
}

/* boot */
if(sessGet(AUTH_KEY) === '1'){ showApp(); }
else { document.getElementById('app').classList.remove('on'); }
</script>
